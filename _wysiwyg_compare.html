<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- 内联 favicon：file:// 页面默认的 /favicon.ico 请求会 404 进 console，被驱动计为页面错误 -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/lib/codemirror/codemirror.css">
<link rel="stylesheet" href="src/styles.css">
<style>
  body { margin: 0; }
  /* 与真实 app 同构的容器层级：wysiwyg 规则（去行号、32px 行留白、遮罩样式）都挂在
     .editor-container.wysiwyg-mode 作用域下，harness 必须复刻这层结构才测得到真实样式 */
  .harness-container { width: 700px; height: 600px; flex: none; }
</style>
</head>
<body>
<div class="editor-container wysiwyg-mode harness-container" id="wysiwyg-container">
  <div class="editor-pane">
    <div id="editor"></div>
  </div>
  <div class="preview-pane"></div>
</div>
<div class="editor-container preview-mode harness-container" id="reading-container">
  <div class="editor-pane"></div>
  <div class="preview-pane">
    <div class="preview-content" id="reading"></div>
  </div>
</div>
<script src="src/lib/codemirror/codemirror.js"></script>
<script src="src/lib/unified-bundle.js"></script>
<script src="src/lib/highlight.js/highlight.min.js"></script>
<link rel="stylesheet" href="src/lib/katex/katex.min.css">
<script src="src/lib/katex/katex.min.js"></script>
<script src="src/lib/katex/auto-render.min.js"></script>
<script src="src/lib/mermaid/mermaid.min.js"></script>
<script src="src/modules/preview-post.js"></script>
<script src="src/modules/code-block.js"></script>
<script src="src/modules/image-processor.js"></script>
<script src="src/modules/render-post.js"></script>
<script src="src/modules/wysiwyg.js"></script>
<script src="src/modules/empty-hint.js"></script>
<script>
// 对比 harness：真实 CM5 + 真实 UnifiedRenderer + 真实 wysiwyg/empty-hint 遮罩代码。
// 由 scripts/wysiwyg-browser-check.mjs 驱动，结果写回 window.__RESULT / __RESULT2。
(function () {
  'use strict';

  const DOC = [
    '# Superpowers-ZH 中文增强版',
    '',
    '本项目已安装 superpowers-zh 技能框架（20 个 skills）。',
    '',
    '## 核心规则',
    '',
    '1.',
    '    收到任务，先检查是否有匹配的 skill — 哪怕只有 1% 的可能性也要检查',
    '',
    '2.',
    '    设计先于编码 — 收到功能需求时，先用 brainstorming skill 做需求分析',
    '',
    '- 普通列表项 A',
    '- 普通列表项 B',
    '',
    '- [ ] 待办任务一',
    '- [x] 已完成任务二',
    '',
    '> 引用块第一行',
    '> 引用块第二行',
    '',
    '$$ E = mc^2 $$',
    '',
    '| 列甲 | 列乙 |',
    '| --- | --- |',
    '| 1 | 2 |',
    '',
    '```js',
    'const a = 1; // 围栏内 # 与 | 都不应切块',
    '```',
    '',
    '结尾段落。',
    '',
    // 缩写定义与使用放同一块（逐块渲染的已知边界：跨块拿不到别块的定义），
    // 这样逐块与整篇渲染行为一致，可检验遮罩内缩写还原。
    // 注意本渲染器的缩写语法是 *[term]: def（定义行单独解析，非 GFM 的 *[term]*: ）。
    // 多行展示公式且内部含独占一行的 `=`（CommonMark setext 下划线触发器）：
    // 切块若未先做公式守卫，remark 会把 `=` 当 setext 标题，公式劈成两块、前半渲染成巨型 h1
    // （真机 demo.md 矩阵乘法实测，2026-10-08 用户截图）。守卫后必须是一个完整块。
    '矩阵乘法：',
    '',
    '$$',
    '\\begin{bmatrix}',
    'a_{11} & a_{12} \\\\',
    'a_{21} & a_{22}',
    '\\end{bmatrix}',
    '=',
    '\\begin{bmatrix}',
    'c_{11} & c_{12} \\\\',
    'c_{21} & c_{22}',
    '\\end{bmatrix}',
    '$$',
    '',
    '*[Tizu]: TizuMark Editor',
    '本段使用缩写 Tizu 指代编辑器。',
    '',
    '这个特性 :rocket: 让两种模式保持一致。',
    '',
    '<details>',
    '<summary>折叠内容</summary>',
    '折叠块内部文字。',
    '</details>',
  ].join('\n');

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  // 与 Rust heading_to_id（src-tauri/src/lib.rs）对齐：字母数字保留（小写），空格/-/_ 折叠为 -
  const headingToId = (text) => {
    let id = '';
    for (const ch of String(text || '')) {
      if (/[\p{L}\p{N}]/u.test(ch)) id += ch.toLowerCase();
      else if (ch === ' ' || ch === '-' || ch === '_') id += '-';
    }
    return id.replace(/-+/g, '-').replace(/^-|-$/g, '');
  };

  // ---------- TauriApi mock（对齐真实 app 的 IPC 面） ----------
  // 真实 app 的 window.TauriApi 由 tauri-api.js COMMANDS 生成；所见即所得/阅读模式的
  // 异步后处理路径（[TOC]=generate_toc、图片=fetch_image_as_base64）都走它。harness 此前
  // 没有它 → 这些路径以「Tauri 运行时不可用」被静默跳过、从未被测到（2026-10-11 四缺陷漏网根因之一）。
  const TINY_PNG_B64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
  // 逐行对照 Rust generate_toc：#..######（代码围栏外）→ 嵌套 ul；无标题返回空串
  function mockGenerateToc(content) {
    const items = [];
    let inCode = false;
    for (const line of String(content || '').split('\n')) {
      const t = line.trimStart();
      if (t.startsWith('```')) { inCode = !inCode; continue; }
      if (inCode) continue;
      const m = t.match(/^(#{1,6})\s+(.*)$/);
      if (!m) continue;
      const text = m[2].trim();
      items.push({ level: m[1].length, text, id: headingToId(text) });
    }
    if (!items.length) return '';
    let html = '<div class="toc"><div class="toc-title">📑 目录</div><ul class="toc-list">';
    let prev = 0;
    for (const it of items) {
      if (it.level > prev) { for (let k = prev; k < it.level; k++) html += '<ul>'; }
      else if (it.level < prev) { for (let k = it.level; k < prev; k++) html += '</ul>'; }
      html += '<li><a href="#' + esc(it.id) + '">' + esc(it.text) + '</a></li>';
      prev = it.level;
    }
    for (let k = 0; k < prev; k++) html += '</ul>';
    html += '</ul></div>';
    return html;
  }
  window.__mockGenerateToc = mockGenerateToc;
  window.TauriApi = {
    generateToc: (args) => Promise.resolve(mockGenerateToc(args && args.content)),
    fetchImageAsBase64: async () => {
      await sleep(25); // 模拟 IPC + 读盘延迟，暴露代数/时序竞态
      return TINY_PNG_B64;
    },
    readBundledImageAsBase64: async () => { throw new Error('mock: not a bundled tab'); },
  };

  function makeEditor(doc, overrides) {
    const host = document.getElementById('editor');
    host.innerHTML = '';
    // lineNumbers: true 与真实 app 一致（app 建 CM 时恒开行号），
    // 进入所见即所得后由 applyWysiwygEditorChrome 关掉——可验证「去行号」行为
    const cm = CodeMirror(host, { value: doc, lineWrapping: true, lineNumbers: true });
    cm.setSize('700px', '600px');
    // 阅读模式参照物：#preview 的字体/字号/行高是 applySettings 写内联样式的，
    // 这里复刻真实默认值（16px / 1.7），wysiwyg 遮罩必须与之完全一致
    const reading = document.getElementById('reading');
    reading.style.fontSize = '16px';
    reading.style.lineHeight = '1.7';
    const base = {
      cm,
      settings: { softBreaks: false, tabSize: 4, extendedSyntax: true, codeLineNumbers: false, lineNumbers: true, maxWidth: 0 },
      t: (k) => k,
      preview: reading,
      isDark: false,
      escapeHtml: esc,
      escapeAttr: esc,
      headingToId,
      _mermaidCache: new Map(),
      _imageBase64Cache: new Map(),
      getCachedImageURL: (u) => u,
      activeTab: null,
    };
    if (overrides) Object.assign(base, overrides);
    const ed = Object.assign(base, window.TMWysiwyg.mixin, window.TMEmptyHint.mixin);
    ed.viewMode = 'wysiwyg';
    // 模拟 editor-core 的事件接线（真实 app 中 cursorActivity/change 都接到这里）
    cm.on('cursorActivity', () => ed.syncWysiwygActiveBlock());
    cm.on('change', () => { if (ed.viewMode === 'wysiwyg') ed.refreshWysiwygBlocks(); ed.updateEmptyLineHint(); });
    return { cm, ed, host };
  }

  const tagsOf = (h) => (h.match(/<(h\d|p|ol|ul|li|blockquote|table|thead|tbody|tr|pre|code|input)[^>]*>/g) || [])
    .map(t => t.replace(/\s[\s\S]*$/, '>')).join(',');

  // ---------- 场景 1：渲染一致性 + 提示 + 点击 + 复选框 ----------
  window.__runCompare = function () {
    const { cm, ed, host } = makeEditor(DOC);

    const readingHtml = window.UnifiedRenderer.renderMarkdown(DOC, ed.settings);
    document.getElementById('reading').innerHTML = readingHtml;
    ed.renderWysiwygMasks();

    const maskNodes = Array.from(host.querySelectorAll('.wysiwyg-block-mask'));

    // 遮罩内容统一从 mark 模型取（markText 的 replacedWith 节点），不依赖 CM 视口物化：
    // 文档底部块在 600px 视口内未渲染进 DOM，querySelectorAll 会漏掉它们（滚动才物化）。
    const markHtmlByIdx = new Map();
    // 汇总所有遮罩节点到独立容器：CM5 只把视口附近的行物化进 DOM，文档底部块不在
    // host 的 DOM 里（querySelectorAll 会漏），但 mark.replacedWith 节点始终持有完整
    // （已后处理的）innerHTML。内容检查统一走这里，与滚动位置解耦。
    const maskFrag = document.createElement('div');
    try {
      ed._wysiwygMarks.forEach((mark, idx) => {
        if (!mark || !mark.replacedWith) return;
        markHtmlByIdx.set(idx, mark.replacedWith.innerHTML);
        maskFrag.appendChild(mark.replacedWith.cloneNode(true));
      });
    } catch (e) { }
    let maskCountModel = markHtmlByIdx.size;

    // 1) white-space
    const ws = maskNodes.length ? getComputedStyle(maskNodes[0]).whiteSpace : 'none';

    // 2) 逐块与整篇同构（活动块现渲染插回对齐）
    const activeIdx = ed._wysiwygActiveIdx;
    const alignedTags = [];
    ed._wysiwygBlocks.forEach((b, i) => {
      const html = (i === activeIdx) ? ed.renderWysiwygBlockHtml(b.start, b.end) : (markHtmlByIdx.get(i) || '');
      alignedTags.push(tagsOf(html || ''));
    });
    const wholeTags = tagsOf(readingHtml);
    // math 块产出 0 个结构标签（span 不在结构集内）：逐块 join 会留空段、整篇不会，
    // 比较前两侧都去掉空段，判据才对「块级结构同构」保持对称
    const norm = (s) => s.split(',').filter(t => t !== '').join(',');
    const structureEqual = norm(wholeTags) === norm(alignedTags.join(','));

    // 3) 列表序号与内容同行
    let listInlineGap = null;
    const ol = host.querySelector('.wysiwyg-block-mask ol');
    if (ol) {
      const li = ol.querySelector('li');
      const p = li && li.querySelector('p');
      if (li && p) listInlineGap = Math.abs(p.getBoundingClientRect().top - li.getBoundingClientRect().top);
    }

    // 4) 无空列表项
    const emptyLi = maskNodes.filter(n => Array.from(n.querySelectorAll('li'))
      .some(li => li.textContent.trim() === '')).length;

    // 5) 空行塌缩
    const blankCollapsed = host.querySelectorAll('.cm-wysiwyg-blank').length;

    // 6) 空行提示：光标落空行 → wrap 类挂上 + ::after 内容 = 提示文案
    let hintClass = false, hintText = null;
    try {
      cm.setCursor({ line: 1, ch: 0 }); // 空行
      ed.updateEmptyLineHint();
      const wrappers = host.querySelectorAll('.cm-empty-placeholder');
      hintClass = wrappers.length > 0;
      if (hintClass) {
        const lineEl = wrappers[0].querySelector('.CodeMirror-line');
        hintText = getComputedStyle(lineEl, '::after').content;
      }
    } catch (e) { hintClass = false; }

    // 7) 点击锚定：点击遮罩中部，被点中的源码行顶边应回到点击时的屏幕 y（±8px）。
    //    判据用「行顶边」而非光标像素：光标落行尾，长行换行时光标自然不在行首，那是行内偏移不是视口跳动。
    let clickAnchorGap = null, clickDiag = null;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      // 先滚到文档中段：锚定本质是「把目标行拉回点击处」，若已抵文档顶/底则被浏览器钳制，
      // 那种偏差是物理上不可消除的，放在顶部测只会得到假失败。
      cm.scrollTo(0, 260);
      ed.updateWysiwygViewportMasks();
      const vis = Array.from(host.querySelectorAll('.wysiwyg-block-mask'))
        .filter(n => { const r = n.getBoundingClientRect(); return r.top > 120 && r.bottom < 520 && r.height > 20; });
      const target = vis[0] || Array.from(host.querySelectorAll('.wysiwyg-block-mask'))[3];
      const rect = target.getBoundingClientRect();
      const clickY = rect.top + rect.height / 2;
      target.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientY: clickY }));
      const ln = cm.getCursor().line;
      const top = cm.charCoords({ line: ln, ch: 0 }, 'window').top;
      clickAnchorGap = Math.round(Math.abs(top - clickY) * 100) / 100;
      clickDiag = { line: ln, clickY: Math.round(clickY), top: Math.round(top), scrollTop: Math.round(cm.getScrollInfo().top) };
    } catch (e) { clickAnchorGap = null; }

    // 8) 表格单元格就地源码编辑（Phase 2 / R5，2026-10-13）：点最后一个数据格 → 该格
    //    contenteditable 显示源码 '2'，整表保持遮罩，光标**不再**移到源码行（旧点击定位行为
    //    被就地编辑取代；端到端提交/Tab/Esc 见 S18）
    let tableCellEdit = null;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      const tds = Array.from(host.querySelectorAll('.wysiwyg-block-mask td'));
      const td = tds[tds.length - 1];
      td.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientY: td.getBoundingClientRect().top + 2 }));
      tableCellEdit = { editable: td.getAttribute('contenteditable') === 'true', text: td.textContent, cursorLine: cm.getCursor().line };
      td.blur(); // 无变化提交（恢复渲染），场景后续步骤不受编辑态影响
    } catch (e) { tableCellEdit = null; }

    // 9) 复选框
    let checkboxToggled = false;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      const box = host.querySelector('.wysiwyg-block-mask input[type="checkbox"]');
      ed.toggleWysiwygTaskCheckbox(box);
      checkboxToggled = /\[x\]/.test(cm.getLine(15));
      ed.toggleWysiwygTaskCheckbox(host.querySelector('.wysiwyg-block-mask input[type="checkbox"]'));
    } catch (e) { checkboxToggled = false; }

    // 10) 预览后处理对齐：公式须转 KaTeX、代码须高亮包裹、复选框须移除 disabled
    //（renderMarkdown 只产出结构 HTML，KaTeX/高亮是预览端独立 pass，遮罩不补跑就露源码）
    let mathRendered = false, codeHighlighted = false, checkboxEnabled = false;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      // 重建汇总（renderWysiwygMasks 会重建 marks）
      maskFrag.innerHTML = '';
      ed._wysiwygMarks.forEach((mark) => {
        if (mark && mark.replacedWith) maskFrag.appendChild(mark.replacedWith.cloneNode(true));
      });
      mathRendered = !!maskFrag.querySelector('.math-display .katex, .katex');
      codeHighlighted = !!maskFrag.querySelector('code .code-scroll');
      const cb = maskFrag.querySelector('input[type="checkbox"]');
      checkboxEnabled = !!cb && !cb.disabled;
    } catch (e) { }

    // 11) 显示效果与阅读模式逐项对齐（2026-10-08 需求）：
    //     行号隐藏 / 字号、行高、字体族一致 / 无块级底色 / 32px 水平边距 /
    //     emoji、缩写、标题锚点 id、details 展开、代码块复制按钮
    let gutterHidden = null, fontSizeParity = null, lineHeightParity = null, fontFamilyParity = null;
    let bgTransparent = null, paddingParity = null, emojiRendered = false, abbrRendered = false;
    let headingIdSet = false, detailsOpened = false, copyBtnPresent = false;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      const reading = document.getElementById('reading');
      const m = host.querySelector('.wysiwyg-block-mask');
      if (m) {
        const csM = getComputedStyle(m);
        const csR = getComputedStyle(reading);
        gutterHidden = !host.querySelector('.CodeMirror-linenumber');
        fontSizeParity = csM.fontSize === csR.fontSize;
        lineHeightParity = csM.lineHeight === csR.lineHeight;
        fontFamilyParity = csM.fontFamily === csR.fontFamily;
        bgTransparent = csM.backgroundColor === 'rgba(0, 0, 0, 0)';
        // 水平边距：遮罩首个块级元素相对编辑器容器左缘 vs 阅读区首个块级元素相对其容器左缘
        const firstInMask = m.querySelector('h1,h2,h3,h4,h5,h6,p,ul,ol,table,pre,blockquote,hr');
        const firstInReading = reading.querySelector('h1,h2,h3,h4,h5,h6,p,ul,ol,table,pre,blockquote,hr');
        const wrapRect = host.getBoundingClientRect();
        const readRect = reading.getBoundingClientRect();
        if (firstInMask && firstInReading) {
          const lm = Math.round(firstInMask.getBoundingClientRect().left - wrapRect.left);
          const lr = Math.round(firstInReading.getBoundingClientRect().left - readRect.left);
          paddingParity = { mask: lm, reading: lr, equal: Math.abs(lm - lr) <= 1 };
        }
        // 内容检查走 mark 模型汇总（含视口外未物化块；renderWysiwygMasks 刚重建过 marks）
        maskFrag.innerHTML = '';
        markHtmlByIdx.clear();
        ed._wysiwygMarks.forEach((mark, idx) => {
          if (!mark || !mark.replacedWith) return;
          markHtmlByIdx.set(idx, mark.replacedWith.innerHTML);
          maskFrag.appendChild(mark.replacedWith.cloneNode(true));
        });
        maskCountModel = markHtmlByIdx.size;
        emojiRendered = /🚀/.test(maskFrag.textContent);
        abbrRendered = !!maskFrag.querySelector('abbr[title="TizuMark Editor"]');
        const hs = Array.from(maskFrag.querySelectorAll('h1, h2'));
        headingIdSet = hs.length > 0 && hs.every(h => !!h.id);
        detailsOpened = !!maskFrag.querySelector('details[open]');
        copyBtnPresent = !!maskFrag.querySelector('pre .copy-btn');
      }
    } catch (e) { window.__ERR11 = (e && e.message) || String(e); }

    // 12) 多行展示公式（内含独占一行的 `=`，setext 触发器）必须是【一个完整块】：
    //     切块未做公式守卫时 remark 会把 `=` 当 setext 下划线，公式劈成两块、前半渲染成巨型 h1
    let mathBlockIntact = false;
    try {
      const blks = ed._wysiwygBlocks || [];
      mathBlockIntact = blks.some(b => {
        if (b.end - b.start < 5) return false;
        return cm.getLine(b.start).trim() === '$$' && cm.getLine(b.end - 1).trim() === '$$';
      });
    } catch (e) { mathBlockIntact = false; }

    window.__RESULT = {
      maskCount: maskCountModel,
      blockCount: ed._wysiwygBlocks.length,
      activeIdx,
      ws, structureEqual, listInlineGap, emptyLi, blankCollapsed,
      hintClass, hintText,
      clickAnchorGap, clickDiag, tableCellEdit, checkboxToggled,
      mathRendered, codeHighlighted, checkboxEnabled,
      gutterHidden, fontSizeParity, lineHeightParity, fontFamilyParity,
      bgTransparent, paddingParity, emojiRendered, abbrRendered,
      headingIdSet, detailsOpened, copyBtnPresent, mathBlockIntact,
      wholeTagsSample: wholeTags.slice(0, 300),
      maskTagsSample: alignedTags.join(',').slice(0, 300),
    };
  };

  // ---------- 场景 5：整篇视觉比对（截图素材） ----------
  // 用真实文档（如 demo.md 内容）同时渲染「所见即所得（顶部）」与「阅读模式」，
  // 供驱动脚本截图后人工/视觉模型比对。
  window.__runVisual = async function (docText) {
    const doc = docText != null ? docText : DOC;
    // 模拟真实 app「打开本地文档」：activeTab 带 filePath → 相对图片走 TauriApi 读盘
    //（harness mock），不落到浏览器 fetch 兜底（file:// 下 CORS 报错，真实 app 无此路径）
    const { cm, ed, host } = makeEditor(doc, { activeTab: { filePath: 'C:/docs/demo.md', isBundled: false } });
    window.__wysiwygLast = { cm, ed, host }; // 供诊断脚本访问实例
    ed.renderWysiwygMasks();

  // ---------- S12：Mermaid 图表（回归：批量渲染时机 + 并发/重挂） ----------
  function maskMermaidStats(ed) {
    let containers = 0, svgs = 0, codeLeft = 0;

      ed._wysiwygMarks.forEach((mark) => {

        mark.replacedWith.querySelectorAll('.mermaid-container').forEach((c) => {
          containers++;
          if (c.querySelector('svg')) svgs++;
        });
        codeLeft += mark.replacedWith.querySelectorAll('code.language-mermaid').length;
      });
    } catch (_) {}
    return { containers, svgs, codeLeft };
  }
  window.__runMermaid = async function () {

      '# 图表测试',
      '',
      '```mermaid',
      'graph TD',
      'A[开始] --> B[结束]',
      '```',
      '',
      '## 中段标题',
      '',
      '```mermaid',
      'sequenceDiagram',
      'Alice->>Bob: 你好',
      'Bob-->>Alice: 再见',
      '```',

      readingSvgs = reading.querySelectorAll('.mermaid-container svg').length;
      readingContainers = reading.querySelectorAll('.mermaid-container').length;
    } catch (_) {}

    // 光标移入第一张图所在块（转源码态）→ 再移出（重挂）→ 图必须恢复
    cm.setCursor({ line: 2, ch: 0 });   // 第一张 mermaid 围栏首行
    await sleep(300);
    cm.setCursor({ line: 21, ch: 0 });  // 结尾段落

  // ---------- S13：ref 定义行块塌缩（与阅读模式「不显示定义行」对齐，2026-10-12 #1） ----------
  window.__runRefDef = function () {
    const doc = [

      '',
      '结尾段落。',

    const { cm, ed, host } = makeEditor(doc);
    const out = { blocks: 0, hiddenDivs: 0, placeholderOk: false, hiddenHeight: null, defLineVisible: false, readingShowsDef: false, blocksSample: [] };
    try {
      ed.renderWysiwygMasks();
      const blocks = ed._wysiwygBlocks || [];
      out.blocks = blocks.length;
      out.blocksSample = blocks.map(b => [b.start, b.end]).join('|');
      let defMaskNode = null;
      ed._wysiwygMarks.forEach((mark) => {
        if (!mark || !mark.replacedWith) return;
        const d = mark.replacedWith.querySelector('.wysiwyg-block-hidden');
        if (d) { out.hiddenDivs++; if (!defMaskNode) defMaskNode = mark.replacedWith; out.hiddenHeight = d.offsetHeight; }
      });

      // 用户可见契约 = 定义行不可见（全部零高度塌缩），不要求块数
      out.placeholderOk = out.hiddenDivs >= 1;
      // 定义行源码文本不得可见（引用处显示字面 [text][ref] 是 R12 已知边界，只断言定义行/URL 不泄漏）
      const linesEl = host.querySelector('.CodeMirror-lines');
      const visible = linesEl ? linesEl.textContent : host.textContent;
      out.defLineVisible = visible.includes(']: https://example.com') || visible.includes('https://docs.example.com');

      const readingHtml = window.UnifiedRenderer.renderMarkdown(doc, ed.settings);
      out.readingShowsDef = readingHtml.includes(']: https://example.com');
      void cm;

    window.__RESULT_REFDEF = out;
    return out;
  };

  // ---------- S14：块「编辑」按钮（hover 显现 / 全块挂载 / 代码块让位 / 点击解罩落块首，2026-10-12 #4） ----------

  // ---------- S15：活动块背景高亮（cm-wysiwyg-active-block 行类，2026-10-12 #5） ----------
  // 2026-10-13 三轮修正后的契约：底色 = 代码块同色 --code-bg（参考图灰盒）；逐行无圆角，
  // 仅块首行上缘/末行下缘圆角（first/last 行类）→ 多行块读作「一整块编辑区」。
  window.__runActiveHighlight = async function () {
    const { cm, ed } = makeEditor(DOC);

      // → 旧行撤光 + 全块高亮（首行仅上角、末行仅下角、中间行无角类 = 整块一体观感）
      cm.setSelection({ line: 12, ch: 1 }, { line: 12, ch: 1 }, { scroll: false });
      await sleep(120);
      const bgs2 = bgDivs();
      out.inList = {
        activeIdx: ed._wysiwygActiveIdx, line2: lineHas(2), line12: lineHas(12), line13: lineHas(13),
        rows: bgs2.length,

        lastOnlyBottom: bgs2.length > 1 ? (bgs2[bgs2.length - 1].classList.contains('cm-wysiwyg-active-last') && !bgs2[bgs2.length - 1].classList.contains('cm-wysiwyg-active-first')) : false,
        midCorners: bgs2.slice(1, -1).some(d => d.classList.contains('cm-wysiwyg-active-first') || d.classList.contains('cm-wysiwyg-active-last')),

      cm.setSelection({ line: 1, ch: 0 }, { line: 1, ch: 0 }, { scroll: false });

  // ---------- S16：预渲染管线（loading 配对 / 在飞守卫 / 切标签内容替换后重算，2026-10-12 #2/#3） ----------
  // ⚠️ 函数名不得与既有 S7 的 __runPreRenderFlow 冲突（后者写 __RESULT7）
  window.__runPreRenderTabFlow = async function () {
    const load = { begin: 0, end: 0 };
    const { cm, ed } = makeEditor(DOC, {
      _beginPaneLoad() { load.begin++; },
      _endPaneLoad() { load.end++; },
      // harness 无 theme.js：applyViewMode 用最小替身。真实实现 = 清遮罩 + **50ms 计时器**挂遮罩
      //（wysiwyg.js L1335/L1342 注释：预渲染结果在 applyViewMode 内 clearWysiwygMasks 之后、
      //  50ms 计时器 renderWysiwygMasks 消费之前落位）。stub 必须同样延迟，否则同步调用会读到
      //  上一轮残留的 _wysiwygPreRenderedBlocks（与本轮新 preValue 值相等时误复用旧块表）。
      applyViewMode() {
        this._applyViewModeCalls = (this._applyViewModeCalls || 0) + 1;
        const self = this;
        setTimeout(() => { if (self.viewMode === 'wysiwyg') self.renderWysiwygMasks(); }, 50);
      },
    });
    const out = {};
    try {
      // 进入所见即所得（模拟从源码/阅读模式点按钮）
      ed.viewMode = 'edit';
      out.started = ed.beginWysiwygPreRender();
      out.inFlight = ed._wysiwygPreRendering;
      out.beginAtStart = load.begin;
      // 在飞期间 renderWysiwygMasks 必须跳过（不得消费旧块表/空块表）
      const before = (ed._wysiwygBlocks || []).length;
      ed.renderWysiwygMasks();
      out.guardHeld = before === (ed._wysiwygBlocks || []).length;
      await sleep(400); // 50ms 预渲染 + 遮罩
      out.done = {
        viewMode: ed.viewMode,
        preRendering: ed._wysiwygPreRendering,
        blocks: (ed._wysiwygBlocks || []).length,
        loadBegin: load.begin,
        loadEnd: load.end,
        applyCalls: ed._applyViewModeCalls,
      };
      // 模拟切标签（真实 switchTab 顺序：cm.setValue(新内容) → syncViewModeToTab → 预渲染）
      const doc2 = ['# 新文档', '', '段落一。', '', '## 小节', '', '段落二。'].join('\n');
      cm.setValue(doc2);
      out.tabStarted = ed.beginWysiwygPreRender();
      await sleep(450); // 50ms 预渲染 + 50ms 消费计时器 + 250ms 输入防抖（全部落定，无残留计时器）
      out.tab = {
        viewMode: ed.viewMode,
        blocks: (ed._wysiwygBlocks || []).length,
        valueOk: cm.getValue() === doc2,
        firstLine: cm.getLine(0),
        loadBegin: load.begin,
        loadEnd: load.end,
      };
    } catch (e) { out.err = (e && e.message) || String(e); }
    window.__RESULT_PRERENDER = out;
    return out;
  };

  // ---------- S17：所见即所得跳转解罩（行定位 / 锚点 #id，2026-10-12 二报告） ----------
  // 多行遮罩块内部的行定位：CM5 把 setSelection 钳制到标记边缘（旧缺陷：大纲/目录跳转落点漂移）；
  // 修复路径 = 先解罩目标块再落点（面包屑/锚点/全局搜索三入口同一契约）。

    return out;

  // ---------- S18：表格单元格就地源码编辑（Phase 2 / R5，2026-10-13） ----------
  // 点渲染表格的格子 → 该格 contenteditable 显示原始源码（整表保持遮罩）；
  // 失焦/Enter 提交 = 纯函数重建整行回写（裸 | 自动转义）+ 立即重渲本块；Tab 行内切格；Esc 取消。
  // DOC 表格（文档行号，非文件行号）：行 23 表头 / 行 24 分隔 / 行 25 数据「| 1 | 2 |」，

  window.__runTableCellEdit = async function () {
    const { cm, ed } = makeEditor(DOC);

      const t = document.querySelector('div.wysiwyg-block-mask table');
      return t ? Array.from(t.querySelectorAll('tbody tr td')) : [];
    };
    try {
      out.rowBefore = cm.getLine(DATA_LINE);

      if (cells0.length < 2) throw new Error('表格遮罩未挂载或格数不足');
      const cell2 = cells0[1]; // 第一行第二格（源 '2'）

      cell2.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, button: 0 }));
      await sleep(80);

        editable: cell2.getAttribute('contenteditable') === 'true',
        cls: cell2.classList.contains('wysiwyg-cell-editing'),

        tableNotActive: ed._wysiwygActiveIdx !== blockIdx,

      cell2.textContent = 'hello | world';
      cell2.blur();
      await sleep(150);
      out.rowAfter = cm.getLine(DATA_LINE);
      const cells1 = curCells();
      out.rerendered = {
        oldDetached: !cell2.isConnected,
        newCellText: cells1[1] ? cells1[1].textContent : null,
        notEditable: cells1[1] ? (cells1[1].getAttribute('contenteditable') == null) : false,
        cursorLine: cm.getCursor().line,
        activeIdx: ed._wysiwygActiveIdx,

      const cellA = curCells()[0];
      cellA.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, button: 0 }));
      await sleep(80);
      out.tabStart = { editable: cellA.getAttribute('contenteditable') === 'true', text: cellA.textContent };
      cellA.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
      await sleep(120);
      const cells2 = curCells();
      out.tab = {
        nextEditable: cells2[1] ? cells2[1].getAttribute('contenteditable') === 'true' : false,
        nextText: cells2[1] ? cells2[1].textContent : null, // 应显示第二格原始源码（含 \|）
        firstRestored: cells2[0] ? cells2[0].textContent : null,
        rowUnchanged: cm.getLine(DATA_LINE) === out.rowAfter,

      cellB.textContent = 'SHOULD_NOT_WRITE';
      cellB.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      await sleep(100);
      const cells3 = curCells();
      out.esc = {
        rowUnchanged: cm.getLine(DATA_LINE) === out.rowAfter,
        restoredText: cells3[1] ? cells3[1].textContent : null,
        notEditable: cells3[1] ? (cells3[1].getAttribute('contenteditable') == null) : false,
      };
    } catch (e) { out.err = (e && e.message) || String(e); }
    window.__RESULT_CELLEDIT = out;
    return out;
  };

  // ---------- S19：大文档 loading 持留至遮罩挂完（2026-10-13 反馈 #1：
  // 「点击所见即所得，loading 完之后什么都不显示，等几秒之后才显示出来」） ----------
  // 旧缺陷：预渲染完成即 _endPaneLoad，而 applyViewMode 的 50ms 计时器之后 renderWysiwygMasks
  // 还要同步挂全部遮罩（数秒）→ loading 消失后露「源码/空白数秒」。
  // 新契约：loading 层必须盖到遮罩挂完（渲染挂载与释放同一 tick，采样上 release ≥ mount）。
  window.__runPreRenderHold = async function () {
    // ~1000 行 / 数百块的大文档（标题+段落+代码块交替，贴近真实文件规模）
    const parts = ['# 大文档', ''];
    for (let i = 0; i < 160; i++) {
      parts.push('## 小节 ' + i, '',
        '这是第 ' + i + ' 节的正文段落，长度足够让段落块独立成块并被遮罩渲染。',
        '', '```js', 'function f' + i + '(x) { return x * 2; }', '```', '');
    }
    const bigDoc = parts.join('\n');
    const load = { begin: 0, end: 0 };
    const { cm, ed } = makeEditor(bigDoc, {
      _beginPaneLoad() { load.begin++; },
      _endPaneLoad() { load.end++; },
      // 与真实 theme.js applyViewMode 同契约：50ms 计时器后才 renderWysiwygMasks
      applyViewMode() {
        setTimeout(() => { if (ed.viewMode === 'wysiwyg') ed.renderWysiwygMasks(); }, 50);
      },
    });
    const out = {};
    try {
      const started = ed.beginWysiwygPreRender();
      let mountedAt = -1, releasedAt = -1, maskCountAtRelease = -1;
      const t0 = Date.now();
      while (Date.now() - t0 < 15000) {
        await new Promise(r => setTimeout(r, 10));
        const masks = document.querySelectorAll('div.wysiwyg-block-mask').length;
        if (mountedAt < 0 && masks > 0) mountedAt = Date.now() - t0;
        if (releasedAt < 0 && load.begin > 0 && load.end >= load.begin) {
          releasedAt = Date.now() - t0;
          maskCountAtRelease = masks;
        }
        if (mountedAt >= 0 && releasedAt >= 0) break;
      }
      out.mt = {
        lines: cm.lineCount(), started, mountedAt, releasedAt, maskCountAtRelease,
        begin: load.begin, end: load.end,
        masks: document.querySelectorAll('div.wysiwyg-block-mask').length,
        blocks: (ed._wysiwygBlocks || []).length,
      };
      // loading 不得早于遮罩挂载释放（同 tick 完成时采样值相等 = 通过）
      out.holdOk = out.mt.started === true && out.mt.mountedAt >= 0 && out.mt.releasedAt >= 0 &&
        out.mt.releasedAt >= out.mt.mountedAt && out.mt.maskCountAtRelease > 0 &&
        out.mt.begin === 1 && out.mt.end === 1;
    } catch (e) { out.err = (e && e.message) || String(e); }
    window.__RESULT_HOLD = out;
    return out;
  };

  // ---------- S20：表格行/列操作（2026-10-13 用户要求 #2） ----------
  // hover 表 → 右缘「＋」增列 / 下缘「＋」增行（点击回写 + 自动格编辑新格）；
  // 行左缘把手 / 表头格拖拽换位（实时重排 DOM，释放按纯函数回写整块）。
  // 独立文档：3 列 × 3 数据行（DOC 的表只有 1 数据行，拖拽无意义）。
  window.__runTableTools = async function () {
    const TDOC = [
      '# 表格操作', '',
      '| 甲 | 乙 | 丙 |',
      '| --- | --- | --- |',
      '| r1a | r1b | r1c |',
      '| r2a | r2b | r2c |',
      '| r3a | r3b | r3c |', '',
    ].join('\n');
    const { cm, ed } = makeEditor(TDOC);
    ed.renderWysiwygMasks();
    await sleep(100);
    const out = {};
    const tableEl = () => document.querySelector('div.wysiwyg-block-mask table');
    const wrapEl = () => document.querySelector('div.wysiwyg-block-mask .wysiwyg-table-wrap');
    const tableLines = () => {
      // 表格块源码行（按当前块表现算，行数变化后索引会位移）
      const tbl = tableEl();
      if (!tbl) return [];
      const mask = tbl.closest('div.wysiwyg-block-mask');
      const bi = parseInt(mask.getAttribute('data-block-index'), 10);
      const b = ed._wysiwygBlocks[bi];
      if (!b) return [];
      const ls = [];
      for (let i = b.start; i < b.end; i++) ls.push(cm.getLine(i));
      return ls;
    };
    const cellsOf = (tr) => Array.from(tr.children);
    // 用 splitTableRow 归一化单元格（trim、\| 还原），断言不依赖空格写法
    const lineCells = (ln) => window.TMWysiwyg.splitTableRow(ln).cells;
    const tryEscCell = async () => {
      // 自动格编辑中 → Esc 取消（无变化不落盘），保证后续操作用于干净表格
      const c = document.querySelector('div.wysiwyg-block-mask table .wysiwyg-cell-editing');
      if (c) {
        c.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
        await sleep(80);
      }
    };
    const pDown = (el, x, y) => el.dispatchEvent(new PointerEvent('pointerdown', {
      bubbles: true, cancelable: true, button: 0, clientX: x, clientY: y, pointerId: 1, isPrimary: true,
    }));
    const pMove = (x, y) => window.dispatchEvent(new PointerEvent('pointermove', {
      bubbles: true, cancelable: true, button: 0, clientX: x, clientY: y, pointerId: 1, isPrimary: true,
    }));
    const pUp = (x, y) => window.dispatchEvent(new PointerEvent('pointerup', {
      bubbles: true, cancelable: true, button: 0, clientX: x, clientY: y, pointerId: 1, isPrimary: true,
    }));
    try {
      // 0) 工具注入：wrap 容器 + 两枚按钮（默认隐藏）
      const w0 = wrapEl();
      if (!w0) throw new Error('表格未包进 wysiwyg-table-wrap');
      const btnRow = w0.querySelector('.wysiwyg-table-add-row');
      const btnCol = w0.querySelector('.wysiwyg-table-add-col');
      if (!btnRow || !btnCol) throw new Error('缺增行/增列按钮');
      // 默认隐藏 = 透明但恒可命中（2026-10-13 反馈 #5：条带自身即悬停触发区——
      // 鼠标移到表格右边/下边一点才显示，故透明态也必须 pointer-events:auto 才能被
      // mouseenter 触发；恒 display:flex 以便 JS 类驱动可见性）
      const hiddenOf = (b) => { const s = getComputedStyle(b); return s.opacity === '0' && s.pointerEvents === 'auto'; };
      out.injected = {
        wrap: true,
        btnHidden: hiddenOf(btnRow) && hiddenOf(btnCol),
      };
      out.lines0 = tableLines().length; // 5（表头+分隔+3 数据行）

      // 1) 增行：点下缘「＋」→ 源码 +1 空行 + 自动格编辑新末行末格
      btnRow.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, button: 0 }));
      await sleep(200);
      out.addRow = {
        lines: tableLines().length,
        lastRow: tableLines()[tableLines().length - 1],
        lastRowEmpty: tableLines()[tableLines().length - 1] ? tableLines()[tableLines().length - 1].replace(/[| \-]/g, '') === '' : false,
      };
      const editCell1 = document.querySelector('div.wysiwyg-block-mask table .wysiwyg-cell-editing');
      out.autoEdit1 = editCell1 ? {
        editable: editCell1.getAttribute('contenteditable') === 'true',
        isLastCell: (() => { const tr = editCell1.closest('tr'); return tr && tr.children[tr.children.length - 1] === editCell1; })(),
        row: editCell1.closest('tr') ? Array.from(editCell1.closest('tbody') ? editCell1.closest('tbody').querySelectorAll('tr') : []).length : -1,
      } : null;
      await tryEscCell();

      // 2) 增列：点右缘「＋」→ 每行 +1 空列（分隔行补 ---）+ 自动格编辑新末格
      // （增行提交后遮罩已重建：按钮是旧节点，必须重新查）
      wrapEl().querySelector('.wysiwyg-table-add-col')
        .dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, button: 0 }));
      await sleep(200);
      const l2 = tableLines();
      out.addCol = {
        cellsPerRow: l2.map((ln) => (ln.match(/\|/g) || []).length),
        sepOk: l2[1] ? (l2[1].split('|').filter((s) => s.trim() !== '').length) : -1,
      };
      const editCell2 = document.querySelector('div.wysiwyg-block-mask table .wysiwyg-cell-editing');
      out.autoEdit2 = editCell2 ? {
        isLastCell: (() => { const tr = editCell2.closest('tr'); return tr && tr.children[tr.children.length - 1] === editCell2; })(),
      } : null;
      await tryEscCell();

      // 3) 行拖拽：首数据行（r1）左缘把手 → 拖到第二数据行（r2）中心 → r1 落到 r2 之后
      const tbody0 = tableEl().querySelector('tbody');
      const tr1 = tbody0.querySelectorAll('tr')[0];
      const tr2 = tbody0.querySelectorAll('tr')[1];
      const c1 = cellsOf(tr1)[0].getBoundingClientRect();
      const c2 = cellsOf(tr2)[0].getBoundingClientRect();
      pDown(cellsOf(tr1)[0], c1.left + 4, c1.top + c1.height / 2);
      await sleep(30);
      pMove(c1.left + 6, c1.top + c1.height / 2 + 6); // 超 4px 阈值 → 进入拖拽（仍在 r1 行内，位置不变）
      await sleep(30);
      pMove(c2.left + 4, c2.top + c2.height / 2); // 移到 r2 中心 → r1 落到 r2 之后
      await sleep(30);
      pUp(c2.left + 4, c2.top + c2.height / 2);
      await sleep(200);
      const l3 = tableLines();
      out.rowDrag = {
        // 每数据行首格（归一化）：行拖拽后应为 [r2a, r1a, r3a, '']
        order: l3.slice(2).map((ln) => lineCells(ln)[0]),
        grid: l3.slice(2).map(lineCells),
      };

      // 4) 列拖拽：表头首格（甲）→ 拖过第二列（乙）中点 → 甲/乙 两列换位
      const thA = tableEl().querySelector('thead th');
      const thB = tableEl().querySelectorAll('thead th')[1];
      const hA = thA.getBoundingClientRect();
      const hB = thB.getBoundingClientRect();
      pDown(thA, hA.left + hA.width / 2, hA.top + hA.height / 2);
      await sleep(30);
      pMove(hB.left + hB.width / 2, hA.top + hA.height / 2); // 到乙中点 → 甲列插到乙之前
      await sleep(30);
      pUp(hB.left + hB.width / 2, hA.top + hA.height / 2);
      await sleep(200);
      const l4 = tableLines();
      // 注意：行拖拽后数据行序 = [r2, r1, r3, 空行]
      out.colDrag = {
        header: lineCells(l4[0]),
        dataRows: [l4[2], l4[3], l4[4]].map(lineCells),
        dragGone: !document.querySelector('.wysiwyg-table-dragging-row, .wysiwyg-table-dragging-col'),
      };

      // 5) 结构提交后块表仍一致：表格块遮罩在、遮罩行数 = 块表 end-start（增行 +1 已反映）
      const mNow = tableEl().closest('div.wysiwyg-block-mask');
      const biNow = parseInt(mNow.getAttribute('data-block-index'), 10);
      const bNow = ed._wysiwygBlocks[biNow];
      out.finalState = {
        masked: !!(ed._wysiwygMarks && ed._wysiwygMarks.has(biNow)),
        blockSpan: bNow ? (bNow.end - bNow.start) : null, // 6（5 行 + 增行 1）
        srcFirstCells: bNow ? lineCells(cm.getLine(bNow.start)) : null,
        lineCount: cm.lineCount(),
      };
    } catch (e) { out.err = (e && e.message) || String(e); }
    window.__RESULT_TABLETOOLS = out;
    return out;
  };

  // ---------- S21：格编辑真实 I/O 诊断（2026-10-13 反馈 #3：点格选中文字 / 一输入就失焦） ----------
  // 合成 dispatchEvent 不走浏览器真实输入管线，复现不了「一输入就失焦」。本场景只负责
  // 建表 + 报告目标格坐标 + 暴露状态读取；真实 page.mouse.click / page.keyboard.type 由
  // 驱动（trusted 事件）执行，逐步读取 activeElement / 选区 / 格文本，定位焦点被谁夺走。
  window.__runCellEditRealIO = async function () {
    const { cm, ed } = makeEditor(DOC);
    ed.renderWysiwygMasks();
    await sleep(120);
    const out = {};
    const DATA_LINE = 25;
    try {
      const t = document.querySelector('div.wysiwyg-block-mask table');
      if (!t) throw new Error('表格遮罩未挂载');
      const cells = Array.from(t.querySelectorAll('tbody tr td'));
      if (cells.length < 2) throw new Error('格数不足');
      const cell = cells[1]; // 源 '2'
      cell.scrollIntoView({ block: 'center' });
      await sleep(60);
      const r = cell.getBoundingClientRect();
      out.rect = { x: r.x, y: r.y, w: r.width, h: r.height };
      out.cellTextBefore = cell.textContent;
      out.rowBefore = cm.getLine(DATA_LINE);
      window.__cellEditTarget = cell;
    } catch (e) { out.err = (e && e.message) || String(e); }
    return out;
  };
  // 状态快照：焦点在谁 / 选区内容 / 编辑格文本（驱动在真实 click/输入各阶段调用）
  window.__cellState = function () {
    const ae = document.activeElement;
    const editing = document.querySelector('div.wysiwyg-block-mask table .wysiwyg-cell-editing');
    const anyCell = editing || (window.__cellEditTarget && window.__cellEditTarget.isConnected
      ? window.__cellEditTarget
      : document.querySelector('div.wysiwyg-block-mask table td'));
    const sel = window.getSelection();
    let selStr = null, selInCell = false;
    try {
      selStr = sel ? sel.toString() : null;
      selInCell = !!(anyCell && sel && sel.anchorNode && anyCell.contains(sel.anchorNode));
    } catch (_) { }
    return {
      activeTag: ae ? ae.tagName : null,
      activeIsCell: !!(ae && anyCell && (ae === anyCell || anyCell.contains(ae))),
      cellEditable: anyCell ? anyCell.getAttribute('contenteditable') : null,
      cellText: anyCell ? anyCell.textContent : null,
      selStr: selStr,
      selInCell: selInCell,
    };
  };

  // ---------- S25：格编辑期间异步 pass 完成不得打掉焦点（2026-10-14 反馈「输入文字时
  // 会失去焦点、打到一半跳到别处」）----------
  // 根因：图片/Mermaid/TOC 异步 pass 完成回调 → _wysiwygRefreshAfterMaskChange → cm.refresh()
  // → CM5 regChange 全区间 → resetView → patchDisplay 重建全部行 DOM，遮罩 widget（含正在
  // 编辑的 contenteditable 格）被重新 appendChild 移挂 → Chromium 对被移动的聚焦元素必触发
  // blur → 格 blur 处理器登记「下一 tick 提交」→ 打字中途被回写、cm.focus() 光标跳到表后。
  // 契约：_wysiwygCellEditing 期间 cm.refresh() 必须挂起（标志置位、不重建 DOM）；格编辑
  // 结束（提交/取消）后补跑一次 refresh，几何补偿不丢。
  window.__runCellEditAsyncRefresh = async function () {
    const tdoc = ['# 表', '', '| 甲 | 乙 |', '| --- | --- |', '| a | b |', '', '段落。'].join('\n');
    const { cm, ed } = makeEditor(tdoc);
    ed.renderWysiwygMasks();
    await sleep(120);
    const out = {};
    const DATA_LINE = 4;
    try {
      const t = document.querySelector('div.wysiwyg-block-mask table');
      if (!t) throw new Error('表格遮罩未挂载');
      const cells = Array.from(t.querySelectorAll('tbody tr td'));
      const cell = cells[1]; // 源 'b'
      cell.scrollIntoView({ block: 'center' });
      await sleep(60);
      out.cellConnectedBefore = cell.isConnected;
      // 真实点击进格编辑（与 S22 真实 IO 同路径）
      const r = cell.getBoundingClientRect();
      cell.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, button: 0, clientX: r.x + 4, clientY: r.y + 4 }));
      await sleep(60);
      out.entered = cell.getAttribute('contenteditable') === 'true';
      out.editingBefore = !!document.querySelector('div.wysiwyg-block-mask table .wysiwyg-cell-editing');
      // 模拟异步 pass（图片读盘/Mermaid/TOC）恰在打字途中完成 → 触发遮罩后刷新
      ed._wysiwygRefreshAfterMaskChange();
      await sleep(120); // blur 延迟提交是 0-tick，120ms 足够暴露旧 bug
      const st = ed._wysiwygCellEditing;
      out.refreshPendingDuringEdit = ed._wysiwygPendingRefreshAfterCellEdit === true;
      out.stillEditing = !!st && st.cell === cell;
      out.cellStillConnected = cell.isConnected;
      out.cellEditable = cell.getAttribute('contenteditable');
      out.rowUnchanged = cm.getLine(DATA_LINE) === '| a | b |';
      // 继续打字仍应落入本格（焦点未被夺走）：模拟用户改了格内容
      cell.textContent = 'b2';
      out.cellTextNow = cell.textContent;
      // 正常提交路径（Enter）→ 遮罩重挂 + 补跑挂起的 refresh（几何补偿不丢）
      cell.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', isComposing: false, bubbles: true, cancelable: true }));
      await sleep(150);
      out.rowAfterCommit = cm.getLine(DATA_LINE);
      out.pendingFlushedAfterCommit = ed._wysiwygPendingRefreshAfterCellEdit === false;
      out.tableStillThere = !!document.querySelector('div.wysiwyg-block-mask table');
    } catch (e) { out.err = (e && e.message) || String(e); }
    window.__RESULT_CELLEDIT_AREFRESH = out;
    return out;
  };

  // ---------- S22：格编辑 IME 组合期不中断（2026-10-13 反馈 #3「一输入文字光标就失去焦点」） ----------
  // 中文输入法：组合期内的 Enter = 确认拼音/选字，不是提交格子。旧代码 keydown 处理器对
  // Enter 一律 preventDefault+blur（未查 isComposing/st.composing）→ 焦点丢失、只能输一个字。
  // 契约：compositionstart→compositionend 期间 Enter 必须被忽略（不提交、不 blur、源码不变）；
  // 组合结束后 Enter 恢复「提交格子」语义。
  window.__runCellEditIME = async function () {
    const { cm, ed } = makeEditor(DOC);
    ed.renderWysiwygMasks();
    await sleep(100);
    const out = {};
    const DATA_LINE = 25;
    try {
      const t = document.querySelector('div.wysiwyg-block-mask table');
      if (!t) throw new Error('表格遮罩未挂载');
      const cells = Array.from(t.querySelectorAll('tbody tr td'));
      if (cells.length < 2) throw new Error('格数不足');
      const cell = cells[1]; // 源 '2'
      out.rowBefore = cm.getLine(DATA_LINE);
      cell.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, button: 0 }));
      await sleep(60);
      out.entered = cell.getAttribute('contenteditable') === 'true';
      // 组合开始（等价于正在敲拼音）
      cell.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
      await sleep(20);
      // 组合期内按 Enter（确认拼音）→ 必须被忽略：不提交、不 blur、源码不变
      cell.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
      await sleep(60);
      const stillEditing = document.querySelector('div.wysiwyg-block-mask table .wysiwyg-cell-editing');
      out.duringComposing = {
        stillInEdit: !!(stillEditing && cell === stillEditing),
        cellStillConnected: cell.isConnected,
        rowUnchanged: cm.getLine(DATA_LINE) === out.rowBefore,
      };
      // 组合结束：写入确认的汉字
      cell.textContent = '你';
      cell.dispatchEvent(new CompositionEvent('compositionend', { bubbles: true }));
      await sleep(20);
      // WebView2 时序怪癖：compositionend 先于「选字确认 Enter」keydown 到达
      // （isComposing=false）——该残影 Enter 必须被吞（不提交、不插换行、焦点不丢）
      cell.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', isComposing: false, bubbles: true, cancelable: true }));
      await sleep(80);
      out.afterComposingEnd = {
        ghostEnterSwallowed: cm.getLine(DATA_LINE) === out.rowBefore
          && !!(document.querySelector('div.wysiwyg-block-mask table .wysiwyg-cell-editing') === cell)
          && cell.isConnected
          && cell.textContent.indexOf('\n') < 0,
        row: cm.getLine(DATA_LINE),
      };
      // 超过 250ms 残影窗口后，用户真正的提交 Enter 恢复提交语义
      await sleep(300);
      cell.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', isComposing: false, bubbles: true, cancelable: true }));
      await sleep(150);
      const rowAfter = cm.getLine(DATA_LINE);
      out.commitAfterGhost = {
        committed: rowAfter !== out.rowBefore,
        rowAfter: rowAfter,
        rowHasChar: rowAfter.indexOf('你') >= 0,
        cellDetached: !cell.isConnected,
      };
    } catch (e) { out.err = (e && e.message) || String(e); }
    window.__RESULT_CELLEDIT_IME = out;
    return out;
  };

  // ---------- S23：增行/增列「＋」真实鼠标可达（2026-10-13 反馈 #3「点不到，一移就消失」） ----------
  // 按钮在 wrap 盒子外（+6px 间隙）。旧代码鼠标穿过间隙即丢 :hover → 按钮消失。悬停桥
  // （.wysiwyg-table-wrap::before/::after）把间隙并入命中区。本场景建表 + 报告几何；驱动用
  // 真实 page.mouse.move 沿「表格边缘→按钮」逐步滑动，每步读按钮 display 与 wrap:hover，
  // 最后真实点击断言行/列确实增加。
  window.__runTableToolsHover = async function () {
    const tdoc = ['# 表', '', '| 甲 | 乙 |', '| --- | --- |', '| a | b |', '', '段尾。'].join('\n');
    const { cm, ed } = makeEditor(tdoc);
    ed.renderWysiwygMasks();
    await sleep(120);
    const out = {};
    try {
      const t = document.querySelector('div.wysiwyg-block-mask table');
      const wrap = t && t.closest('.wysiwyg-table-wrap');
      if (!t || !wrap) throw new Error('表格/ wrap 未挂载');
      t.scrollIntoView({ block: 'center' });
      await sleep(60);
      const r = t.getBoundingClientRect();
      out.tableRect = { x: r.x, y: r.y, w: r.width, h: r.height, bottom: r.bottom, right: r.right, cx: r.x + r.width / 2, cy: r.y + r.height / 2 };
      // ⚠️ 可见网格 ≠ table 元素盒（盒被 width:100% 撑满、网格按内容收缩左对齐）：
      // 用首/末格 cell rect 量真实可见网格（2026-10-13 用户截图「按钮离表格很远」的根因）。
      const cells = Array.from(t.querySelectorAll('tr'));
      const firstCell = cells[0] && cells[0].children[0];
      const lastRow = cells[cells.length - 1];
      const lastCell = lastRow && lastRow.children[lastRow.children.length - 1];
      const fr = firstCell.getBoundingClientRect();
      const lr = lastCell.getBoundingClientRect();
      out.gridRect = { x: fr.x, y: fr.y, left: fr.left, top: fr.top, right: lr.right, bottom: lr.bottom, w: lr.right - fr.left, h: lr.bottom - fr.top, cx: fr.left + (lr.right - fr.left) / 2 };
      out.wrapRect = (() => { const w = t.closest('.wysiwyg-table-wrap'); const b = w.getBoundingClientRect(); return { x: b.x, w: b.width, h: b.height, right: b.right, bottom: b.bottom }; })();
      out.preRect = (() => { const p = t.closest('pre.CodeMirror-line'); if (!p) return null; const b = p.getBoundingClientRect(); return { x: b.x, w: b.width, right: b.right }; })();
      // 2026-10-13 反馈 #1/#2：条带自身 rect + 下一行 CM 行顶缘（验证横条落留白内、不压下一行）
      out.rowStripRect = (() => { const b = t.closest('.wysiwyg-table-wrap').querySelector('.wysiwyg-table-add-row'); if (!b) return null; const r = b.getBoundingClientRect(); return { top: r.top, bottom: r.bottom, h: r.height, w: r.width, left: r.left, right: r.right }; })();
      out.colStripRect = (() => { const b = t.closest('.wysiwyg-table-wrap').querySelector('.wysiwyg-table-add-col'); if (!b) return null; const r = b.getBoundingClientRect(); return { top: r.top, bottom: r.bottom, h: r.height, w: r.width, left: r.left, right: r.right }; })();
      out.nextLineTop = (() => { const p = t.closest('pre.CodeMirror-line'); const n = p && p.nextElementSibling; if (!n) return null; return n.getBoundingClientRect().top; })();
      // 条带中心（2026-10-13 反馈 #3：条带紧贴表格边框、无间隙）：
      // 横条顶缘 = 表底缘（16px 厚 → 中心 = 表底+8）；竖条左缘 = 表右缘（16px 宽 → 中心 = 右缘+8）
      out.addRowBtn = { x: out.gridRect.cx, y: out.gridRect.bottom + 8 };
      out.addColBtn = { x: out.gridRect.right + 8, y: out.gridRect.top + out.gridRect.h / 2 };
      out.trBefore = t.querySelectorAll('tr').length;
      out.tdColsBefore = t.querySelectorAll('tr').length ? t.querySelectorAll('tr')[0].children.length : 0;
    } catch (e) { out.err = (e && e.message) || String(e); }
    return out;
  };
  // 状态读取（驱动在每步滑动后调用）。stripHover = per-strip 显隐类
  //（2026-10-13 反馈 #5：只有鼠标在条带自身区域才挂）；lineZ = 悬停桥抬升的行 z-index。
  window.__btnState = function (cls) {
    const b = document.querySelector('div.wysiwyg-block-mask .' + cls);
    if (!b) return { missing: true, opacity: null, pointerEvents: null, wrapHover: null, toolsHover: null, stripHover: null, lineZ: null };
    const wrap = document.querySelector('div.wysiwyg-table-wrap');
    const line = wrap ? wrap.closest('.CodeMirror-line') : null;
    const s = getComputedStyle(b);
    const stripCls = cls === 'wysiwyg-table-add-col' ? 'wysiwyg-table-add-col-hover' : 'wysiwyg-table-add-row-hover';
    return {
      missing: false,
      opacity: s.opacity,
      pointerEvents: s.pointerEvents,
      wrapHover: wrap ? wrap.matches(':hover') : null,
      toolsHover: wrap ? wrap.classList.contains('wysiwyg-table-tools-hover') : null,
      stripHover: wrap ? wrap.classList.contains(stripCls) : null,
      lineZ: line ? getComputedStyle(line).zIndex : null,
    };
  };
  window.__tableShape = function () {
    const t = document.querySelector('div.wysiwyg-block-mask table');
    if (!t) return { rows: 0, cols: 0 };
    return { rows: t.querySelectorAll('tr').length, cols: t.querySelectorAll('tr')[0] ? t.querySelectorAll('tr')[0].children.length : 0 };
  };
  // 悬停桥诊断：给定视口坐标，报告该点命中的元素 + wrap→根 每一层的 rect 与 overflow
  // （定位下缘桥为何收不到 hover：哪一层裁掉了垂直溢出 / 谁压在伪元素上层）。
  window.__hoverDebug = function (x, y) {
    const at = document.elementFromPoint(x, y);
    const wrap = document.querySelector('div.wysiwyg-block-mask .wysiwyg-table-wrap');
    const name = (el) => {
      if (!el) return null;
      const c = (el.className && el.className.baseVal !== undefined) ? el.className.baseVal : el.className;
      return el.tagName + (c ? '.' + String(c).trim().split(/\s+/).slice(0, 2).join('.') : '');
    };
    // 逐层祖先：rect + overflow + position + zIndex
    const chain = [];
    if (wrap) {
      let el = wrap;
      while (el && el !== document.documentElement && chain.length < 12) {
        const b = el.getBoundingClientRect();
        const s = getComputedStyle(el);
        chain.push({
          el: name(el),
          y: +b.y.toFixed(1), bottom: +b.bottom.toFixed(1), h: +b.height.toFixed(1),
          x: +b.x.toFixed(1), right: +b.right.toFixed(1),
          overflow: s.overflow, overflowY: s.overflowY, position: s.position, zIndex: s.zIndex,
        });
        el = el.parentElement;
      }
    }
    let after = null;
    if (wrap) { const s = getComputedStyle(wrap, '::after'); after = { content: s.content, position: s.position, top: s.top, left: s.left, width: s.width, height: s.height, transform: s.transform, pointerEvents: s.pointerEvents, zIndex: s.zIndex }; }
    // 命中元素的详情 + 它所在 CM 行的 z-index（判断谁压在按钮上层）
    let hit = null;
    if (at) {
      const b = at.getBoundingClientRect();
      const lineOfHit = at.closest('pre.CodeMirror-line, .CodeMirror-line');
      const ls = lineOfHit ? getComputedStyle(lineOfHit) : null;
      hit = {
        el: name(at),
        text: (at.textContent || '').slice(0, 20),
        rect: { x: +b.x.toFixed(1), y: +b.y.toFixed(1), w: +b.width.toFixed(1), h: +b.height.toFixed(1) },
        hitLineZ: ls ? ls.zIndex : null,
        hitLinePos: ls ? ls.position : null,
      };
    }
    return {
      point: { x, y },
      elementFromPoint: name(at),
      hit: hit,
      wrapAfter: after,
      chain: chain,
    };
  };

  // ---------- S24：表格外拖拽把手（2026-10-13 用户参考图：行把手=表格外左缘点阵；
  // 列把手=表上方蓝色胶囊；hover 行/列 → 出现该行的把手/该列的高亮+胶囊）。
  // 建表 + 报告把手几何与各行列 rect；驱动用真实 page.mouse 完成：
  // ① hover 行 → 行把手 ::before 可见（content≠none）+ 行高亮；
  // ② 真实拖行：按行把手拖到下两行 → 源码行序变化；
  // ③ hover 列 → 整列 wysiwyg-col-hover + 胶囊 ::before 可见且几何在表上方；
  // ④ 真实拖列：按胶囊拖到右两列 → 源码列序变化。
  window.__runTableHandles = async function () {
    const tdoc = ['# 把手表', '', '| A1 | B1 | C1 |', '| --- | --- | --- |', '| a2 | b2 | c2 |', '| a3 | b3 | c3 |', '| a4 | b4 | c4 |', '', '段尾。'].join('\n');
    const { cm, ed } = makeEditor(tdoc);
    ed.renderWysiwygMasks();
    await sleep(120);
    const out = {};
    try {
      const t = document.querySelector('div.wysiwyg-block-mask table');
      const wrap = t && t.closest('.wysiwyg-table-wrap');
      if (!t || !wrap) throw new Error('表格/ wrap 未挂载');
      t.scrollIntoView({ block: 'center' });
      await sleep(60);
      const trs = Array.from(t.querySelectorAll('tr'));
      if (trs.length < 4) throw new Error('行数不足（需表头+3 数据行）');
      const rows = trs.slice(1).map((tr) => {
        const b = tr.getBoundingClientRect();
        return { y: b.y, h: b.height, cy: b.y + b.height / 2, bottom: b.bottom };
      });
      const ths = Array.from(trs[0].children).map((th) => {
        const b = th.getBoundingClientRect();
        return { x: b.x, w: b.width, cx: b.x + b.width / 2, top: b.y, bottom: b.bottom };
      });
      const fr = trs[1].children[0].getBoundingClientRect();
      out.rows = rows;
      out.ths = ths;
      out.firstCellLeft = fr.left;
      out.gridLeft = fr.left;
      out.gridTop = fr.top;
      // 行握点悬停/点击点：左 gutter 带（行轨 left:-24px 宽 24px）× 首数据行中线
      //（点 = 16px 握点中心：右缘距表左缘 6px → x = fr.left - 14）
      out.rowHandle = { x: fr.left - 14, y: rows[0].cy };
      // 表头行 gutter 点：同一左 gutter 带 × 表头行中线（反馈 #2：表头行也出握点、可拖）
      out.headGutter = { x: fr.left - 14, y: ths[1] ? (ths[1].top + ths[1].bottom) / 2 : 0 };
      // 列 2 握点悬停/点击点：顶 gutter 带（列轨 top:0 高 24px）× 列 2 中心
      //（点 = 16px 握点中心：底缘距表顶缘 6px → y = ths[1].top - 14）
      out.colPill = { x: ths[1] ? ths[1].cx : 0, y: ths[1] ? ths[1].top - 14 : 0 };
      // 列 2 单元格中心（hover 用）
      const c2 = trs[2].children[1];
      const c2r = c2 ? c2.getBoundingClientRect() : null;
      out.col2Cell = c2r ? { x: c2r.x + c2r.width / 2, y: c2r.y + c2r.height / 2 } : null;
      // 拖行目标：第 3 行数据行（tbody 第 3 行）中线偏下 8px → 越过中点触发换位
      out.rowDragTo = { y: rows[2] ? rows[2].cy + 8 : 0 };
      // 拖列目标：第 3 列表头中心 + 半列宽 → 越过中点触发换位
      out.colDragTo = { x: ths[2] ? ths[2].cx + ths[2].w / 2 : 0 };
      out.srcBefore = window.__tableSourceLines();
    } catch (e) { out.err = (e && e.message) || String(e); }
    return out;
  };
  // 把手状态：行把手/列胶囊（wrap 上真实元素，JS 定位）的 display/几何 + 行高亮 +
  // 整列 hover 类分布 / 高亮样式
  window.__handleState = function () {
    const t = document.querySelector('div.wysiwyg-block-mask table');
    const wrap = t ? t.closest('.wysiwyg-table-wrap') : null;
    if (!t || !wrap) return { missing: true };
    const out = { missing: false };
    const rectOf = (el) => {
      const b = el.getBoundingClientRect();
      return { l: b.left, r: b.right, t: b.top, b: b.bottom, cx: b.left + b.width / 2, cy: b.top + b.height / 2, w: b.width, h: b.height };
    };
    // 轨道（常驻命中区）+ 握点（可见小把手，opacity 0/1）
    const rowTrack = wrap.querySelector('.wysiwyg-table-row-handle');
    out.rowTrack = rowTrack ? {
      dragging: rowTrack.classList.contains('wysiwyg-dragging'),
      rect: rectOf(rowTrack),
    } : { missing: true };
    const rowGrip = wrap.querySelector('.wysiwyg-table-row-grip');
    out.rowGrip = rowGrip ? {
      opacity: getComputedStyle(rowGrip).opacity,
      background: getComputedStyle(rowGrip).backgroundColor,
      color: getComputedStyle(rowGrip).color,
      rect: rectOf(rowGrip),
    } : { missing: true };
    const colTrack = wrap.querySelector('.wysiwyg-table-col-pill');
    out.colTrack = colTrack ? {
      dragging: colTrack.classList.contains('wysiwyg-dragging'),
      rect: rectOf(colTrack),
    } : { missing: true };
    const colGrip = wrap.querySelector('.wysiwyg-table-col-grip');
    out.colGrip = colGrip ? {
      opacity: getComputedStyle(colGrip).opacity,
      background: getComputedStyle(colGrip).backgroundColor,
      color: getComputedStyle(colGrip).color,
      rect: rectOf(colGrip),
    } : { missing: true };
    const bodyTr = t.querySelector('tbody tr');
    if (bodyTr) out.rowBg = getComputedStyle(bodyTr).backgroundColor;
    // 拖动态：被拖行/列高亮（验证「悬停不高亮、拖动才高亮」）
    const dragTr = t.querySelector('tr.wysiwyg-table-dragging-row');
    if (dragTr) out.dragRowBg = getComputedStyle(dragTr).backgroundColor;
    const dragCell = t.querySelector('td.wysiwyg-table-dragging-col');
    if (dragCell) {
      const cs = getComputedStyle(dragCell);
      out.dragColStyle = { bg: cs.backgroundColor, shadow: cs.boxShadow };
    }
    const ths = Array.from(t.querySelectorAll('thead th'));
    // 每列带 wysiwyg-col-hover 的单元格数（整列 = 行数 4；类仍由 JS 挂，仅无样式）
    const trs = Array.from(t.querySelectorAll('tr'));
    out.colHoverCounts = ths.length ? ths.map((th, i) =>
      trs.filter((tr) => tr.children[i] && tr.children[i].classList.contains('wysiwyg-col-hover')).length) : [];
    // 用 tbody 格判断（th 有默认底色，会误判「悬停高亮」）
    const hoverRow = Array.from(t.querySelectorAll('tbody tr')).find((tr) => tr.children[1] && tr.children[1].classList.contains('wysiwyg-col-hover'));
    if (hoverRow) out.hoverColCellBg = getComputedStyle(hoverRow.children[1]).backgroundColor;
    // 落点指示线（2026-10-13 反馈 #1/#2：拖动态蓝线标落点；行拖横线 / 列拖竖线）
    const dropLine = wrap.querySelector('.wysiwyg-table-drop-line');
    if (dropLine) {
      out.dropLine = {
        opacity: getComputedStyle(dropLine).opacity,
        isRow: dropLine.classList.contains('wysiwyg-drop-line-row'),
        isCol: dropLine.classList.contains('wysiwyg-drop-line-col'),
        rect: rectOf(dropLine),
      };
    }
    // 表体几何（断言蓝线位置 = 表底缘/右缘等）+ 拖动中 DOM 序（反馈 #1/#2：拖拽中
    // 不实时重排，DOM 序应恒为原序，释放后才变）
    out.tableRect = rectOf(t);
    out.domOrder = trs.map((tr) => (tr.children[0] ? tr.children[0].textContent.trim() : ''));
    return out;
  };
  window.__tableSourceLines = function () {
    const el = document.querySelector('.CodeMirror');
    const cm = el && el.CodeMirror;
    return cm ? cm.getValue().split('\n').filter((l) => /^\|/.test(l.trim())) : null;
  };
})();
</script>
</body>
</html>
