<script>
// 对比 harness：真实 CM5 + 真实 UnifiedRenderer + 真实 wysiwyg/empty-hint 遮罩代码。
// 由 scripts/wysiwyg-browser-check.mjs 驱动，结果写回 window.__RESULT / __RESULT2。
(function () {
  'use strict';

  // ---------- S72 bundle shim（2026-10-21 紧凑列表按项切块） ----------
  // 本改动的真源在 src/unified-renderer.js（renderMarkdownBlocks 紧凑列表逐项切块）。
  // 本 harness 加载的是编译产物 src/lib/unified-bundle.js，重建产物属于构建动作（需用户
  // 授权）→ 产物重建前，此处以 post-pass 复刻源版逐块口径，验证下游机制（逐项遮罩片段 /
  // 点击落行 / li-mid 底距 / edge-bottom / S43 等高）；产物重建后，源版直接返回
  // listItem 标签块，本 shim 自动直通（no-op）。
  (function () {
    const RE_TASK = /^(\s*)([-*+])(\s+)\[[ xX]\]\s+/;
    const RE_UL = /^(\s*)([-*+])(\s+)/;
    const RE_OL = /^(\s*)(\d{1,9})([.)])(\s+)/;
    const isMarker = (l) => RE_TASK.test(l) || RE_UL.test(l) || RE_OL.test(l);
    // 项边界 = 下一个缩进 ≤ 当前项缩进的标记行（与 splitBlocks 回退口径一致）
    const itemStarts = (lines) => {
      const starts = [];
      let s = 0;
      while (s < lines.length) {
        starts.push(s);
        const indent = (lines[s].match(/^\s*/) || [''])[0].length;
        s++;
        while (s < lines.length) {
          const m = RE_TASK.exec(lines[s]) || RE_UL.exec(lines[s]) || RE_OL.exec(lines[s]);
          if (m && m[1].length <= indent) break;
          s++;
        }
      }
      return starts;
    };
    if (typeof UnifiedRenderer === 'undefined' ||
        typeof UnifiedRenderer.renderMarkdownBlocks !== 'function') return;
    const orig = UnifiedRenderer.renderMarkdownBlocks;
    UnifiedRenderer.renderMarkdownBlocks = function (content, options) {
      const blocks = orig(content, options);
      if (!blocks) return null;
      if (blocks.some((b) => b && b.listItem)) return blocks; // 产物已重建 → 直通
      const all = String(content == null ? '' : content).split('\n');
      const out = [];
      for (const b of blocks) {
        const slice = all.slice(b.start, b.end);
        const tight = slice.length > 0
          && !slice.some((l) => (l || '').trim() === '')
          && isMarker(slice[0])
          && itemStarts(slice).length > 1;
        if (tight) {
          const starts = itemStarts(slice);
          starts.forEach((st, k) => {
            const en = k + 1 < starts.length ? starts[k + 1] : slice.length;
            out.push({
              start: b.start + st, end: b.start + en,
              // 原 b.html 是整列表 html，逐项片段必须按项重渲染（L600 走 renderWysiwygBlockHtml）
              html: undefined,
              skipped: b.skipped,
              listItem: true,
              listItemPos: (k === 0 ? 'first' : k === starts.length - 1 ? 'last' : 'middle'),
            });
          });
        } else {
          out.push(b);
        }
      }
      return out;
    };
  })();

  const DOC = [
    '# Superpowers-ZH 中文增强版',
    '',
    '本项目已安装 superpowers-zh 技能框架（20 个 skills）。',
    '',
    '## 核心规则',
    '',
    '1.',
    '    收到任务，先检查是否有匹配的 skill — 哪怕只有 1% 的可能性也要检查',
    '',
    '2.',
    '    设计先于编码 — 收到功能需求时，先用 brainstorming skill 做需求分析',
    '',
    '- 普通列表项 A',
    '- 普通列表项 B',
    '',
    '- [ ] 待办任务一',
    '- [x] 已完成任务二',
    '',
    '> 引用块第一行',
    '> 引用块第二行',
    '',
    '$$ E = mc^2 $$',
    '',
    '| 列甲 | 列乙 |',
    '| --- | --- |',
    '| 1 | 2 |',
    '',
    '```js',
    'const a = 1; // 围栏内 # 与 | 都不应切块',
    '```',
    '',
    '结尾段落。',
    '',
    // 缩写定义与使用放同一块（逐块渲染的已知边界：跨块拿不到别块的定义），
    // 这样逐块与整篇渲染行为一致，可检验遮罩内缩写还原。
    // 注意本渲染器的缩写语法是 *[term]: def（定义行单独解析，非 GFM 的 *[term]*: ）。
    // 多行展示公式且内部含独占一行的 `=`（CommonMark setext 下划线触发器）：
    // 切块若未先做公式守卫，remark 会把 `=` 当 setext 标题，公式劈成两块、前半渲染成巨型 h1
    // （真机 demo.md 矩阵乘法实测，2026-10-08 用户截图）。守卫后必须是一个完整块。
    '矩阵乘法：',
    '',
    '$$',
    '\\begin{bmatrix}',
    'a_{11} & a_{12} \\\\',
    'a_{21} & a_{22}',
    '\\end{bmatrix}',
    '=',
    '\\begin{bmatrix}',
    'c_{11} & c_{12} \\\\',
    'c_{21} & c_{22}',
    '\\end{bmatrix}',
    '$$',
    '',
    '*[Tizu]: TizuMark Editor',
    '本段使用缩写 Tizu 指代编辑器。',
    '',
    '这个特性 :rocket: 让两种模式保持一致。',
    '',
    '<details>',
    '<summary>折叠内容</summary>',
    '折叠块内部文字。',
    '</details>',
  ].join('\n');

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  // 与 Rust heading_to_id（src-tauri/src/lib.rs）对齐：字母数字保留（小写），空格/-/_ 折叠为 -
  const headingToId = (text) => {
    let id = '';
    for (const ch of String(text || '')) {
      if (/[\p{L}\p{N}]/u.test(ch)) id += ch.toLowerCase();
      else if (ch === ' ' || ch === '-' || ch === '_') id += '-';
    }
    return id.replace(/-+/g, '-').replace(/^-|-$/g, '');
  };

  // ---------- TauriApi mock（对齐真实 app 的 IPC 面） ----------
  // 真实 app 的 window.TauriApi 由 tauri-api.js COMMANDS 生成；所见即所得/阅读模式的
  // 异步后处理路径（[TOC]=generate_toc、图片=fetch_image_as_base64）都走它。harness 此前
  // 没有它 → 这些路径以「Tauri 运行时不可用」被静默跳过、从未被测到（2026-10-11 四缺陷漏网根因之一）。
  const TINY_PNG_B64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
  // 逐行对照 Rust generate_toc：#..######（代码围栏外）→ 嵌套 ul；无标题返回空串
  function mockGenerateToc(content) {
    const items = [];
    let inCode = false;
    for (const line of String(content || '').split('\n')) {
      const t = line.trimStart();
      if (t.startsWith('```')) { inCode = !inCode; continue; }
      if (inCode) continue;
      const m = t.match(/^(#{1,6})\s+(.*)$/);
      if (!m) continue;
      const text = m[2].trim();
      items.push({ level: m[1].length, text, id: headingToId(text) });
    }
    if (!items.length) return '';
    let html = '<div class="toc"><div class="toc-title">📑 目录</div><ul class="toc-list">';
    let prev = 0;
    for (const it of items) {
      if (it.level > prev) { for (let k = prev; k < it.level; k++) html += '<ul>'; }
      else if (it.level < prev) { for (let k = it.level; k < prev; k++) html += '</ul>'; }
      html += '<li><a href="#' + esc(it.id) + '">' + esc(it.text) + '</a></li>';
      prev = it.level;
    }
    for (let k = 0; k < prev; k++) html += '</ul>';
    html += '</ul></div>';
    return html;
  }
  window.__mockGenerateToc = mockGenerateToc;
  window.TauriApi = {
    generateToc: (args) => Promise.resolve(mockGenerateToc(args && args.content)),
    fetchImageAsBase64: async () => {
      await sleep(25); // 模拟 IPC + 读盘延迟，暴露代数/时序竞态
      return TINY_PNG_B64;
    },
    readBundledImageAsBase64: async () => { throw new Error('mock: not a bundled tab'); },
  };

  function makeEditor(doc, overrides) {
    const host = document.getElementById('editor');
    host.innerHTML = '';
    // lineNumbers: true 与真实 app 一致（app 建 CM 时恒开行号），
    // 进入所见即所得后由 applyWysiwygEditorChrome 关掉——可验证「去行号」行为。
    // ⚠️ mode:'gfm' 必须与真实 app 一致（editor-core L161）：null mode 不产 token span，
    // 漏测「gfm token 色（cm-header 蓝 / cm-variable-2 海军蓝…）压过渲染化 span 色」
    // 的编辑态颜色回归（2026-10-14 用户截图）。
    // ⚠️ extraKeys.Enter 也必须与 app 一致（editor-core L170-171 → format.js
    // _handleTableEnter → 非表格行走 _newlineAndIndent = 列表续行命令）：默认键位 Enter
    // 是裸换行，测不出列表回车续行 + 光标行为（2026-10-14 用户反馈「回车后光标落新行的
    // 下一行」的复现前提）
    const cm = CodeMirror(host, {
      // inputStyle 与真实 app 一致（editor-core L163）：列表回车光标行为在
      // contenteditable 输入管线下才有可比性（2026-10-14 回车光标反馈复现前提）
      // gitHubSpice:false 与真实 app 一致（editor-core mode 配置）：关 GitHub SHA/issue
      // 高亮——渲染器不把这些认成链接，token 下划线会在编辑态漏出（2026-10-15 用户截图）
      value: doc, mode: { name: 'gfm', gitHubSpice: false }, lineWrapping: true, lineNumbers: true,
      // styleActiveLine 与真实 app 一致（editor-core L172）：光标行挂 CodeMirror-activeline
      //（wrap 作用域）——「光标行显示源码」（行内标记恢复真宽+次级色）的 CSS 载体
      styleActiveLine: true,
      inputStyle: 'contenteditable',
      extraKeys: {
        // 与真实 app 同一处理体（editor-core L170-171）：非表格行 → 列表续行；
        // 含「组合刚结束 250ms 内吞掉幽灵 Enter」守卫（2026-10-14 列表回车光标反馈）
        'Enter': (cmx) => ed._handleTableEnter(cmx),
      },
    });
    cm.setSize('700px', '600px');
    // 阅读模式参照物：#preview 的字体/字号/行高是 applySettings 写内联样式的，
    // 这里复刻真实默认值（16px / 1.7），wysiwyg 遮罩必须与之完全一致
    const reading = document.getElementById('reading');
    reading.style.fontSize = '16px';
    reading.style.lineHeight = '1.7';
    const base = {
      cm,
      settings: { softBreaks: false, tabSize: 4, extendedSyntax: true, codeLineNumbers: false, lineNumbers: true, maxWidth: 0 },
      t: (k) => k,
      preview: reading,
      isDark: false,
      escapeHtml: esc,
      escapeAttr: esc,
      headingToId,
      _mermaidCache: new Map(),
      _imageBase64Cache: new Map(),
      getCachedImageURL: (u) => u,
      activeTab: null,
    };
    if (overrides) Object.assign(base, overrides);
    const ed = Object.assign(base, window.TMWysiwyg.mixin, window.TMEmptyHint.mixin,
      (window.TMFormat && window.TMFormat.mixin) || {});
    ed.viewMode = 'wysiwyg';
    // 模拟 editor-core 的事件接线（真实 app 中 cursorActivity/change 都接到这里）
    cm.on('cursorActivity', () => ed.syncWysiwygActiveBlock());
    cm.on('change', () => { if (ed.viewMode === 'wysiwyg') ed.refreshWysiwygBlocks(); ed.updateEmptyLineHint(); });
    // 模拟 editor-core 的 IME 组合接线：⚠️ CM 5.65.18 不触发用户级 composition 编辑器
    // 事件（cm.on 不执行），幽灵 Enter 吞除窗时间戳必须挂输入域的原生 DOM compositionend
    //（与真实 app 完全一致；见 format.js _handleTableEnter 守卫注释）
    ed._wysiwygComposing = false;
    cm.on('compositionstart', () => { ed._wysiwygComposing = true; });
    cm.on('compositionend', () => {
      ed._wysiwygComposing = false;
      if (ed.viewMode === 'wysiwyg') ed.refreshWysiwygBlocks();
    });
    try {
      const inputField = cm.getInputField();
      // ⚠️ 组合标志挂输入域原生 DOM 事件（与 editor-core 一致）：CM 5.65.18 不触发用户级
      // composition 编辑器事件（上方 cm.on 是死代码），组合期内的 insertLineBreak 必是
      // 幽灵 → beforeinput 守卫一律吞（S50 场景：幽灵换行进模型）。与「拼音竖排」无关
      //（竖排是 CSS 层 24px 前缀槽折行，S52 守；组合期模型恒干净）。
      // 修复 IME 上屏写坏列表前缀：直接调用 format.js 的真实方法（与真实 app 完全同一实现，
      // 见 format.js _recordBareListMarkerForIme / _repairImeDamagedListPrefix），本 harness 不复制逻辑。
      inputField.addEventListener('compositionstart', () => {
        ed._wysiwygComposing = true;
        ed._recordBareListMarkerForIme();
        // 标题行组合期字号保持（与 editor-core 同一接线，2026-10-19 用户反馈 #2）
        if (ed._wysiwygImeCompositionStart) ed._wysiwygImeCompositionStart();
      });
      inputField.addEventListener('compositionend', () => {
        ed._wysiwygComposing = false;
        ed._lastCompositionEnd = Date.now();
        ed._repairImeDamagedListPrefix();
        // 摘组合期标题类 + 立即读 DOM（跳过 CM5 80ms 空窗，与 editor-core 同一接线）
        if (ed._wysiwygImeCompositionEnd) ed._wysiwygImeCompositionEnd();
        if (ed._wysiwygImeFlushDOM) ed._wysiwygImeFlushDOM();
      });
      // 与 editor-core 同一幽灵换行守卫（input 通道，2026-10-15 用户复现）：组合标志 +
      // 双时间戳（真实 Enter 被 extraKeys 消费后、紧随 _lastEnterKeydownAt/_lastCompositionEnd
      // 到达的 beforeinput 换行必是幽灵 → 取消；CM5 只在 input 事件读 DOM，取消则读不到）
      inputField.addEventListener('beforeinput', (e) => {
        if (e.inputType !== 'insertLineBreak' && e.inputType !== 'insertParagraph') return;
        // ① 组合期幽灵（与 editor-core 一致）：双时间戳窗口罩不住正在组合中 → 组合标志识别吞
        if (ed._wysiwygComposing) { e.preventDefault(); return; }
        // ② 组合外幽灵：双时间戳窗口 2000ms，与 editor-core 一致（WebView2 IPC 延迟 + WYSIWYG 刷新阻塞）
        const _now = Date.now();
        const _se = ed._lastEnterKeydownAt ? _now - ed._lastEnterKeydownAt : Infinity;
        const _sc = ed._lastCompositionEnd ? _now - ed._lastCompositionEnd : Infinity;
        if (_se < 2000 || _sc < 2000) e.preventDefault();
      });
    } catch (_) { /* 忽略 */ }
    return { cm, ed, host };
  }

  // 通用建编辑器入口（供驱动侧按任意文档建实例 + 初始遮罩，S40 等场景复用）
  window.__makeWysiwygEditor = function (doc) {
    const { cm, ed } = makeEditor(doc);
    const out = { cm, ed };
    ed.renderWysiwygMasks();
    return out;
  };

  // ---------- S54：块间间隙 = 阅读模式 + 点击行缝不出现新行（2026-10-17 用户两项要求） ----------
  // 文档 A = 用户真机文档（5 个列表块、块间单空行）；文档 B = 段落 + 空行 + 标题
  //（空行间隙 X = 24−14 = 10px，点击可落在空行本身上，验证不展开/无提示）。
  // 间隙口径 = 「上块文本末行底缘 → 下块文本首行顶缘」（两态同一元素类型：li 对 li、
  // p 对 p、h1 对 h1），与用户肉眼看到的行距一致。
  const S54_DOC_A = ['', '- [ ] sadfs a df', '- [ ] asdfsadf', '', '1. sadfasdfs', '2. asdfasdf', '3. asdfasdf',
    '', '- [ ] asdfasdfsa', '- [ ] asdfasdf', '- [ ] asdfsadf', '', '- sdfsadfsaf', '- sadfsad f',
    '- asdfs a d', '', '1. sdfsadfsaf sadf as', '2. asdf asd', '3. asdf as', '', '- [ ] sdfsadfs a',
    '- [ ] sdf asd', '- [ ] sadf as'].join('\n');

    // 汇总所有遮罩节点到独立容器：CM5 只把视口附近的行物化进 DOM，文档底部块不在
    // host 的 DOM 里（querySelectorAll 会漏），但 mark.replacedWith 节点始终持有完整
    // （已后处理的）innerHTML。内容检查统一走这里，与滚动位置解耦。
    const maskFrag = document.createElement('div');
    try {
      ed._wysiwygMarks.forEach((mark, idx) => {
        if (!mark || !mark.replacedWith) return;
        markHtmlByIdx.set(idx, mark.replacedWith.innerHTML);
        maskFrag.appendChild(mark.replacedWith.cloneNode(true));
      });
    } catch (e) { }
    let maskCountModel = markHtmlByIdx.size;

    // 1) white-space
    const ws = maskNodes.length ? getComputedStyle(maskNodes[0]).whiteSpace : 'none';

    // 2) 逐块与整篇同构（活动块现渲染插回对齐）
    const activeIdx = ed._wysiwygActiveIdx;
    const alignedTags = [];
    ed._wysiwygBlocks.forEach((b, i) => {
      const html = (i === activeIdx) ? ed.renderWysiwygBlockHtml(b.start, b.end) : (markHtmlByIdx.get(i) || '');
      alignedTags.push(tagsOf(html || ''));
    });
    const wholeTags = tagsOf(readingHtml);
    // math 块产出 0 个结构标签（span 不在结构集内）：逐块 join 会留空段、整篇不会，
    // 比较前两侧都去掉空段，判据才对「块级结构同构」保持对称
    const norm = (s) => s.split(',').filter(t => t !== '').join(',');
    const structureEqual = norm(wholeTags) === norm(alignedTags.join(','));

    // 3) 列表序号与内容同行
    let listInlineGap = null;
    const ol = host.querySelector('.wysiwyg-block-mask ol');
    if (ol) {
      const li = ol.querySelector('li');
      const p = li && li.querySelector('p');
      if (li && p) listInlineGap = Math.abs(p.getBoundingClientRect().top - li.getBoundingClientRect().top);
    }

    // 4) 无空列表项
    const emptyLi = maskNodes.filter(n => Array.from(n.querySelectorAll('li'))
      .some(li => li.textContent.trim() === '')).length;

    // 5) 空行塌缩
    const blankCollapsed = host.querySelectorAll('.cm-wysiwyg-blank').length;

    // 6) 空行提示（2026-10-17 两级语义）：
    //    a) 块间独立空行（行1，h1 与段落之间）：光标落其上不显示提示（点击行缝
    //       不允许出现「新行」观感）；
    //    b) 块内空行（临时在文末追加松散列表构造）：照常显示提示 + 文案。
    //       检查后恢复原文档（后续点击锚定步骤会重跑 renderWysiwygMasks 自愈遮罩）。
    let hintIndependentSuppressed = false, hintInBlockShown = false, hintText = null;
    try {
      cm.setCursor({ line: 1, ch: 0 }); // 块间独立空行
      ed.updateEmptyLineHint();
      hintIndependentSuppressed = host.querySelectorAll('.cm-empty-placeholder').length === 0;
      const before = cm.getValue();
      const n = cm.lineCount();
      // ⚠️ 开头双 \n：DOC 末行是 </details>（HTML 块），CommonMark 类型 6 HTML 块
      // 终止于空行——若直接贴列表项，首项会被吸进 HTML 块，构造不出松散列表
      cm.replaceRange('\n\n- 提示探测项一\n\n- 提示探测项二', { line: n - 1, ch: cm.getLine(n - 1).length });
      ed.renderWysiwygMasks();
      const nl = cm.lineCount();
      // ⚠️ 必须先解罩松散列表再落光标：CM5 对落在 replacedWith 标记区间内部的
      // setCursor 会钳制到标记边界（光标会落到块末行而非块内空行）——真实用户走
      // 遮罩点击（先 setWysiwygActiveBlock 解罩、后 setSelection），此处同序模拟。
      const probeBlk = ed.wysiwygBlockIndexAt(nl - 2);
      if (probeBlk >= 0) ed.setWysiwygActiveBlock(probeBlk);
      cm.setCursor({ line: nl - 2, ch: 0 }); // 松散列表项间空行（块内）
      ed.updateEmptyLineHint();
      const wrappers = host.querySelectorAll('.cm-empty-placeholder');
      hintInBlockShown = wrappers.length > 0;
      if (hintInBlockShown) {
        const lineEl = wrappers[0].querySelector('.CodeMirror-line');
        hintText = getComputedStyle(lineEl, '::after').content;
      }
      cm.setValue(before);
      ed.renderWysiwygMasks();
      cm.setCursor({ line: 0, ch: 0 });
    } catch (e) { hintIndependentSuppressed = false; hintInBlockShown = false; }

    // 7) 点击锚定：点击遮罩中部，被点中的源码行顶边应回到点击时的屏幕 y（±8px）。
    //    判据用「行顶边」而非光标像素：光标落行尾，长行换行时光标自然不在行首，那是行内偏移不是视口跳动。
    let clickAnchorGap = null, clickDiag = null;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      // 先滚到文档中段：锚定本质是「把目标行拉回点击处」，若已抵文档顶/底则被浏览器钳制，
      // 那种偏差是物理上不可消除的，放在顶部测只会得到假失败。
      cm.scrollTo(0, 260);
      ed.updateWysiwygViewportMasks();
      const vis = Array.from(host.querySelectorAll('.wysiwyg-block-mask'))
        .filter(n => { const r = n.getBoundingClientRect(); return r.top > 120 && r.bottom < 520 && r.height > 20; });
      const target = vis[0] || Array.from(host.querySelectorAll('.wysiwyg-block-mask'))[3];
      const rect = target.getBoundingClientRect();
      const clickY = rect.top + rect.height / 2;
      target.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientY: clickY }));
      const ln = cm.getCursor().line;
      const top = cm.charCoords({ line: ln, ch: 0 }, 'window').top;
      clickAnchorGap = Math.round(Math.abs(top - clickY) * 100) / 100;
      clickDiag = { line: ln, clickY: Math.round(clickY), top: Math.round(top), scrollTop: Math.round(cm.getScrollInfo().top) };
    } catch (e) { clickAnchorGap = null; }

    // 8) 表格单元格就地源码编辑（Phase 2 / R5，2026-10-13）：点最后一个数据格 → 该格
    //    contenteditable 显示源码 '2'，整表保持遮罩，光标**不再**移到源码行（旧点击定位行为
    //    被就地编辑取代；端到端提交/Tab/Esc 见 S18）
    let tableCellEdit = null;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      const tds = Array.from(host.querySelectorAll('.wysiwyg-block-mask td'));
      const td = tds[tds.length - 1];
      td.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientY: td.getBoundingClientRect().top + 2 }));
      tableCellEdit = { editable: td.getAttribute('contenteditable') === 'true', text: td.textContent, cursorLine: cm.getCursor().line };
      td.blur(); // 无变化提交（恢复渲染），场景后续步骤不受编辑态影响
    } catch (e) { tableCellEdit = null; }

    // 9) 复选框
    let checkboxToggled = false;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      const box = host.querySelector('.wysiwyg-block-mask input[type="checkbox"]');
      ed.toggleWysiwygTaskCheckbox(box);
      checkboxToggled = /\[x\]/.test(cm.getLine(15));
      ed.toggleWysiwygTaskCheckbox(host.querySelector('.wysiwyg-block-mask input[type="checkbox"]'));
    } catch (e) { checkboxToggled = false; }

    // 10) 预览后处理对齐：公式须转 KaTeX、代码须高亮包裹、复选框须移除 disabled
    //（renderMarkdown 只产出结构 HTML，KaTeX/高亮是预览端独立 pass，遮罩不补跑就露源码）
    let mathRendered = false, codeHighlighted = false, checkboxEnabled = false;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      // 重建汇总（renderWysiwygMasks 会重建 marks）
      maskFrag.innerHTML = '';
      ed._wysiwygMarks.forEach((mark) => {
        if (mark && mark.replacedWith) maskFrag.appendChild(mark.replacedWith.cloneNode(true));
      });
      mathRendered = !!maskFrag.querySelector('.math-display .katex, .katex');
      codeHighlighted = !!maskFrag.querySelector('code .code-scroll');
      const cb = maskFrag.querySelector('input[type="checkbox"]');
      checkboxEnabled = !!cb && !cb.disabled;
    } catch (e) { }

    // 11) 显示效果与阅读模式逐项对齐（2026-10-08 需求）：
    //     行号隐藏 / 字号、行高、字体族一致 / 无块级底色 / 32px 水平边距 /
    //     emoji、缩写、标题锚点 id、details 展开、代码块复制按钮
    let gutterHidden = null, fontSizeParity = null, lineHeightParity = null, fontFamilyParity = null;
    let bgTransparent = null, paddingParity = null, emojiRendered = false, abbrRendered = false;
    let headingIdSet = false, detailsOpened = false, copyBtnPresent = false;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      const reading = document.getElementById('reading');
      const m = host.querySelector('.wysiwyg-block-mask');
      if (m) {
        const csM = getComputedStyle(m);
        const csR = getComputedStyle(reading);
        gutterHidden = !host.querySelector('.CodeMirror-linenumber');
        fontSizeParity = csM.fontSize === csR.fontSize;
        lineHeightParity = csM.lineHeight === csR.lineHeight;
        fontFamilyParity = csM.fontFamily === csR.fontFamily;
        bgTransparent = csM.backgroundColor === 'rgba(0, 0, 0, 0)';
        // 水平边距：遮罩首个块级元素相对编辑器容器左缘 vs 阅读区首个块级元素相对其容器左缘
        const firstInMask = m.querySelector('h1,h2,h3,h4,h5,h6,p,ul,ol,table,pre,blockquote,hr');
        const firstInReading = reading.querySelector('h1,h2,h3,h4,h5,h6,p,ul,ol,table,pre,blockquote,hr');
        const wrapRect = host.getBoundingClientRect();
        const readRect = reading.getBoundingClientRect();
        if (firstInMask && firstInReading) {
          const lm = Math.round(firstInMask.getBoundingClientRect().left - wrapRect.left);
          const lr = Math.round(firstInReading.getBoundingClientRect().left - readRect.left);
          paddingParity = { mask: lm, reading: lr, equal: Math.abs(lm - lr) <= 1 };
        }
        // 内容检查走 mark 模型汇总（含视口外未物化块；renderWysiwygMasks 刚重建过 marks）
        maskFrag.innerHTML = '';
        markHtmlByIdx.clear();
        ed._wysiwygMarks.forEach((mark, idx) => {
          if (!mark || !mark.replacedWith) return;
          markHtmlByIdx.set(idx, mark.replacedWith.innerHTML);
          maskFrag.appendChild(mark.replacedWith.cloneNode(true));
        });
        maskCountModel = markHtmlByIdx.size;
        emojiRendered = /🚀/.test(maskFrag.textContent);
        abbrRendered = !!maskFrag.querySelector('abbr[title="TizuMark Editor"]');
        const hs = Array.from(maskFrag.querySelectorAll('h1, h2'));
        headingIdSet = hs.length > 0 && hs.every(h => !!h.id);
        detailsOpened = !!maskFrag.querySelector('details[open]');
        copyBtnPresent = !!maskFrag.querySelector('pre .copy-btn');
      }
    } catch (e) { window.__ERR11 = (e && e.message) || String(e); }

    // 12) 多行展示公式（内含独占一行的 `=`，setext 触发器）必须是【一个完整块】：
    //     切块未做公式守卫时 remark 会把 `=` 当 setext 下划线，公式劈成两块、前半渲染成巨型 h1
    let mathBlockIntact = false;
    try {
      const blks = ed._wysiwygBlocks || [];
      mathBlockIntact = blks.some(b => {
        if (b.end - b.start < 5) return false;
        return cm.getLine(b.start).trim() === '$$' && cm.getLine(b.end - 1).trim() === '$$';
      });
    } catch (e) { mathBlockIntact = false; }

    window.__RESULT = {
      maskCount: maskCountModel,
      blockCount: ed._wysiwygBlocks.length,
      activeIdx,
      ws, structureEqual, listInlineGap, emptyLi, blankCollapsed,
      hintIndependentSuppressed, hintInBlockShown, hintText,
      clickAnchorGap, clickDiag, tableCellEdit, checkboxToggled,
      mathRendered, codeHighlighted, checkboxEnabled,
      gutterHidden, fontSizeParity, lineHeightParity, fontFamilyParity,
      bgTransparent, paddingParity, emojiRendered, abbrRendered,
      headingIdSet, detailsOpened, copyBtnPresent, mathBlockIntact,
      wholeTagsSample: wholeTags.slice(0, 300),
      maskTagsSample: alignedTags.join(',').slice(0, 300),
    };
  };

  // ---------- 场景 5：整篇视觉比对（截图素材） ----------
  // 用真实文档（如 demo.md 内容）同时渲染「所见即所得（顶部）」与「阅读模式」，
  // 供驱动脚本截图后人工/视觉模型比对。
  window.__runVisual = async function (docText) {
    const doc = docText != null ? docText : DOC;
    // 模拟真实 app「打开本地文档」：activeTab 带 filePath → 相对图片走 TauriApi 读盘
    //（harness mock），不落到浏览器 fetch 兜底（file:// 下 CORS 报错，真实 app 无此路径）
    const { cm, ed, host } = makeEditor(doc, { activeTab: { filePath: 'C:/docs/demo.md', isBundled: false } });
    window.__wysiwygLast = { cm, ed, host }; // 供诊断脚本访问实例
    ed.renderWysiwygMasks();
    const reading = document.getElementById('reading');
    try {
      reading.innerHTML = window.UnifiedRenderer.renderMarkdown(doc, ed.settings);
      // 阅读模式后处理：RenderPost 共享管线（与 preview-controller.render 同 stage 同顺序，
      // 与所见即所得遮罩同一入口——截图对比的是「同一管线在两种编排下的结果」）
      const rp = window.RenderPost;
      if (rp) {
        const opts = { t: (k) => k, isDark: false, escapeHtml: esc, escapeAttr: esc, headingToId };
        rp.normalizeDetails(reading);
        rp.enableCheckboxes(reading);
        rp.prepareImages(reading, {
          activeTab: ed.activeTab,
          imageCache: ed._imageBase64Cache,
          tauri: window.TauriApi,
          getCachedImageURL: (u) => u,
          getRenderGeneration: () => 0,
        }).catch(() => {});
        rp.processEmoji(reading);
        rp.processMath(reading);
        rp.processAbbreviations(reading, opts);
        rp.processHeadings(reading, opts);
        rp.runMermaid(reading, Object.assign({ mermaidCache: new Map() }, opts)).catch(() => {});
        rp.addCopyButtons(reading, opts);
        rp.processCodeBlocks(reading, { hljs: window.hljs, cache: new Map(), lineNumbers: false });
        rp.applyCodeScrollOverflow(reading, { codeScroll: true });
      }
    } catch (e) { }
    // 等两侧 mermaid 全部落定（容器内出现 svg；串行渲染 + demo.md 多图，轮询到 10s 上限）
    const tEnd = Date.now();
    while (Date.now() - tEnd < 10000) {
      let pend = 0;
      const scan = (root) => {
        if (!root || !root.querySelectorAll) return;
        root.querySelectorAll('.mermaid-container').forEach((c) => {
          if (!c.querySelector('svg')) pend++;
        });
      };
      scan(reading);
      try {
        ed._wysiwygMarks.forEach((mark) => { if (mark && mark.replacedWith) scan(mark.replacedWith); });
      } catch (_) {}
      if (pend === 0) break;
      await new Promise(r => setTimeout(r, 200));
    }
    // 滚回顶部，截图取文档首屏
    try { cm.scrollTo(0, 0); reading.scrollTop = 0; } catch (e) { }
    return { blocks: (ed._wysiwygBlocks || []).length };
  };

  // ---------- 场景 2：大文档虚拟遮罩 + IME 守卫 ----------
  // ⚠️ 行数必须 > 10000（全量预渲染上限）：2600 段 × 4 行 = 10400 行，确保走虚拟模式
  window.__runVirtual = function () {
    const parts = [];
    for (let i = 0; i < 2600; i++) {
      parts.push('## 段落标题 ' + i, '', '这是第 ' + i + ' 段的正文内容，用来撑起一个较大的文档。', '');
    }
    const big = parts.join('\n');
    const { cm, ed, host } = makeEditor(big);
    const t0 = performance.now();
    ed.renderWysiwygMasks();
    const elapsed = Math.round(performance.now() - t0);

    const maskCount = host.querySelectorAll('.wysiwyg-block-mask').length;
    const virtual = !!ed._wysiwygVirtual;
    cm.scrollTo(0, 2000);
    ed.updateWysiwygViewportMasks();
    const maskCountAfterScroll = host.querySelectorAll('.wysiwyg-block-mask').length;

    // IME 守卫：组合期间防抖补齐被顺延（计时器重新武装而非立即执行）
    let imeDeferred = false;
    try {
      ed._wysiwygComposing = true;
      ed.refreshWysiwygBlocks();
      imeDeferred = ed._wysiwygMaskTimer != null;
      ed._wysiwygComposing = false;
      if (ed._wysiwygMaskTimer) { clearTimeout(ed._wysiwygMaskTimer); ed._wysiwygMaskTimer = null; }
    } catch (e) { imeDeferred = false; }

    window.__RESULT2 = { blockCount: ed._wysiwygBlocks.length, maskCount, maskCountAfterScroll, virtual, elapsed, imeDeferred };
  };

  // ---------- 场景 3：长文档上的严格点击锚定 ----------
  // 用户反馈「点击后屏幕乱跳到不知道什么位置」的核心场景。短文档遮罩后不足一屏、scrollTop 恒为 0，
  // 锚定必然被浏览器钳制，测不出真实偏差；这里用长文档保证上下都有滚动余量。
  window.__runAnchor = function () {
    const parts = [];
    for (let i = 0; i < 60; i++) {
      parts.push('## 段落标题 ' + i, '', '这是第 ' + i + ' 段的正文内容，用来撑起一个较高的文档以便滚动。', '');
    }
    const { cm, ed, host } = makeEditor(parts.join('\n'));
    ed.renderWysiwygMasks();

    // 真机条件：编辑器不贴窗口顶（上方有工具栏+标签栏，约 100px+）。点击锚定必须把
    // 窗口坐标 click.y 换算成编辑器视口内坐标，否则每次点击都会往下滚一个「工具栏高」
    // （2026-10-09 用户反馈「每次点击都往下滚动一段距离」的复现条件）。
    const OFFSET = 140;
    const prevPad = document.body.style.paddingTop;
    document.body.style.paddingTop = OFFSET + 'px';

    const samples = [];
    // 在文档中段连点 5 个遮罩。S71 口径（2026-10-21 用户反馈「点某行进编辑态再点其他行，
    // 页面往下移动一段距离」）：被点源码行顶边须落回**撤罩前的行顶位置**（单行块=遮罩顶）
    // ——旧口径「行顶 ≈ 点击 y」正是把行顶钉到点击点，点行中部整页下移半个行高。
    for (let k = 0; k < 5; k++) {
      cm.scrollTo(0, 1200 + k * 400);
      ed.updateWysiwygViewportMasks();
      const nodes = Array.from(host.querySelectorAll('.wysiwyg-block-mask'))
        .filter(n => { const r = n.getBoundingClientRect(); return r.top > 150 && r.bottom < 480 && r.height > 24; });
      if (!nodes.length) { samples.push(null); continue; }
      const target = nodes[Math.floor(nodes.length / 2)];
      const rect = target.getBoundingClientRect();
      const clickY = rect.top + rect.height / 2;
      const preTop = rect.top; // S71：撤罩前被点行行顶（单行块 = 遮罩顶）
      target.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientY: clickY }));
      const ln = cm.getCursor().line;
      const pos = { line: ln, ch: 0 };
      const top = cm.charCoords(pos, 'window').top;
      samples.push({
        line: ln,
        clickY: Math.round(clickY),
        top: Math.round(top),
        gap: Math.round(Math.abs(top - preTop) * 100) / 100,
        scrollTop: Math.round(cm.getScrollInfo().top),
      });
    }
    // 连点同一块两次：验证 _wysiwygClickAnchor 不残留（残留会污染后续普通光标移动 → 乱跳）
    cm.scrollTo(0, 1500);
    ed.updateWysiwygViewportMasks();
    const nodes2 = Array.from(host.querySelectorAll('.wysiwyg-block-mask'))
      .filter(n => { const r = n.getBoundingClientRect(); return r.top > 150 && r.bottom < 480 && r.height > 24; });
    const t2 = nodes2[0];
    let residual = null;
    if (t2) {
      const r2 = t2.getBoundingClientRect();
      t2.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientY: r2.top + r2.height / 2 }));
      residual = ed._wysiwygClickAnchor; // 消费后必须为 null
    }

    document.body.style.paddingTop = prevPad;
    window.__RESULT3 = {
      offset: OFFSET,
      samples,
      residualClean: residual === null || residual === undefined,
      maxGap: Math.max(...samples.filter(Boolean).map(s => s.gap)),
    };
  };

  // ---------- 场景 4：虚拟模式滚动锚定 ----------
  // 滚动 → 视口遮罩更新（挂/撤遮罩改变文档高度）→ 视口内容不得漂移。
  // 判据：滚动 100px 后，同一源码行的窗口位置也应恰好下移 100px（偏差 < 20px）。
  window.__runScrollAnchor = function () {
    const parts = [];
    for (let i = 0; i < 60; i++) parts.push('## 段落标题 ' + i, '', '这是第 ' + i + ' 段的正文内容，用来撑起一个较高的文档。', '');
    const { cm, ed } = makeEditor(parts.join('\n'));
    ed.renderWysiwygMasks();

    const drifts = [];
    for (const base of [1000, 1600, 2200]) {
      // 判据：滚动到新位置后，视口遮罩更新（挂/撤遮罩改变文档高度）前后，
      // 视口顶行的窗口位置不得漂移——即用户看到的滚动落点保持稳定。

  // ---------- S19：大文档 loading 持留至遮罩挂完（2026-10-13 反馈 #1：
  // 「点击所见即所得，loading 完之后什么都不显示，等几秒之后才显示出来」） ----------
  // 旧缺陷：预渲染完成即 _endPaneLoad，而 applyViewMode 的 50ms 计时器之后 renderWysiwygMasks
  // 还要同步挂全部遮罩（数秒）→ loading 消失后露「源码/空白数秒」。
  // 新契约：loading 层必须盖到遮罩挂完（渲染挂载与释放同一 tick，采样上 release ≥ mount）。
  window.__runPreRenderHold = async function () {
    // ~1000 行 / 数百块的大文档（标题+段落+代码块交替，贴近真实文件规模）
    const parts = ['# 大文档', ''];
    for (let i = 0; i < 160; i++) {
      parts.push('## 小节 ' + i, '',
        '这是第 ' + i + ' 节的正文段落，长度足够让段落块独立成块并被遮罩渲染。',
        '', '```js', 'function f' + i + '(x) { return x * 2; }', '```', '');
    }
    const bigDoc = parts.join('\n');
    const load = { begin: 0, end: 0 };
    const { cm, ed } = makeEditor(bigDoc, {
      _beginPaneLoad() { load.begin++; },
      _endPaneLoad() { load.end++; },
      // 与真实 theme.js applyViewMode 同契约：50ms 计时器后才 renderWysiwygMasks
      applyViewMode() {
        setTimeout(() => { if (ed.viewMode === 'wysiwyg') ed.renderWysiwygMasks(); }, 50);
      },
    });

    try {
      const started = ed.beginWysiwygPreRender();
      let mountedAt = -1, releasedAt = -1, maskCountAtRelease = -1;
      const t0 = Date.now();

          releasedAt = Date.now() - t0;
          maskCountAtRelease = masks;
        }
        if (mountedAt >= 0 && releasedAt >= 0) break;
      }

        lines: cm.lineCount(), started, mountedAt, releasedAt, maskCountAtRelease,

      out.holdOk = out.mt.started === true && out.mt.mountedAt >= 0 && out.mt.releasedAt >= 0 &&

  // 中文输入法：组合期内的 Enter = 确认拼音/选字，不是提交格子。旧代码 keydown 处理器对

  window.__runCellEditIME = async function () {

    return lis[5].getBoundingClientRect().top - lis[4].getBoundingClientRect().top;
  };

  // ---------- S69：块间空行光标行灰底 + 连续回车不跳顶（2026-10-21 真机用户报 demo.md：
  // ① 图片上方回车新增的行（块间空行、光标在其上）没有灰色明确指示当前编辑行；
  // ② 输入文字时页面乱跳、滚动到目录（文档顶）位置）----------
  // 根因②（repro 脚本实测时间线）：cm.refresh()（光标锚定 doRestore、图片/TOC 异步后
  // 处理完成各触发一次；lineWrapping=true 时 refresh 无条件跑 estimateLineHeights）把
  // **已渲染行**的记录行高重置为单行估算值（WYSIWYG 遮罩是行内 replacedWith 节点、不是
  // line.widgets，启发式对其一无所知：2612px 的 TOC 遮罩行被重置回 ~15px）→ 操作末
  // updateHeightsInViewport 重测后按「实测 − 陈旧记录值」差值一次性补偿
  // scroller.scrollTop（mustScroll，单跳可达数千 px：实测 2612−41=2571px = 跳到文档顶
  // 目录区）；编辑操作无 pending scroll 兜底 → 跳顶固化、光标出视口。块间间隙的 inline
  // 高度原先在 operation 外写入（记录行高与 0px DOM 失步）是第二条失步通道。
  // 文档结构模拟 demo.md：[TOC] 大遮罩在顶部 + 多节段落/列表 + 末段图片，视口定位在
  // 文档下半部（视口上方留有 TOC 大遮罩 + 大量内容 = 跳顶量级足够大）。
  const S69_DOC = (function () {
    const L = ['# S69 文档标题', '[TOC]', ''];
    for (let i = 1; i <= 8; i++) {
      L.push('## ' + i + '.1 节' + i + ' 背景', '');
      for (let j = 1; j <= 3; j++) L.push('节' + i + ' 段落' + j + '。这是一段占位正文，用于把顶部 TOC 大遮罩推到视口上方。');
      L.push('');
      L.push('## ' + i + '.2 节' + i + ' 列表', '');
      for (let j = 1; j <= 4; j++) L.push('- 节' + i + ' 列表项 ' + j + '：占位内容。');
      L.push('');
    }
    // 2026-10-21：图片改用内联 data: URI——picsum.photos 在线图的加载时机逐次不同
    //（网络竞态），图片行高度（17px 占位 ↔ 真实高）在测量窗内变化 → 滚动稳态逐次不同
    //（实测 3173 vs 3048），Enter 窗口的「稳态回落」被记成跳动。内联图加载即时确定。
    const IMG = 'data:image/svg+xml;utf8,' +
      encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400'><rect width='800' height='400' fill='#c8d2dc'/><text x='400' y='200' font-size='28' text-anchor='middle' fill='#41505e'>示例图片</text></svg>");
    L.push('## 9.1 图片', '图片上方段落。', '', '![示例图片](' + IMG + ')', '', '结尾段落。');
    return L.join('\n');
  })();

  window.__runGapCursor2026 = async function () {
    const out = { err: null };
    try {
      const E = window.__makeWysiwygEditor(S69_DOC);
      window.__s69ed = { cm: E.cm, ed: E.ed };
      const cm = E.cm, ed = E.ed;
      const sleep2 = (ms) => new Promise((r) => setTimeout(r, ms));
      cm.getWrapperElement().style.height = '1300px';
      cm.refresh();
      // 等预渲染落定（文档高度连续 ~1.2s 不再增长）
      let lastH = -1, quiet = 0;
      for (let i = 0; i < 40; i++) {
        await sleep2(400);
        const h = cm.getScrollInfo().height;
        quiet = (h === lastH) ? quiet + 400 : 0;
        lastH = h;
        if (quiet >= 1200) break;
      }
      let imgLine = -1, tocLine = -1;
      for (let i = 0; i < cm.lineCount(); i++) {
        const t = cm.getLine(i) || '';
        if (imgLine < 0 && t.indexOf('![示例图片]') === 0) imgLine = i;
        if (tocLine < 0 && t.trim() === '[TOC]') tocLine = i;
      }
      if (imgLine < 0 || tocLine < 0) throw new Error('文档结构未找到 imgLine=' + imgLine + ' tocLine=' + tocLine);
      // 视口定位：图片行距视口顶 ~500px（视口上方 = TOC 大遮罩 + 8 节内容）
      const imgY = cm.charCoords({ line: imgLine, ch: 0 }, 'local').top;
      cm.scrollTo(0, Math.max(0, imgY - 500));
      await sleep2(400);

      const lineState = (n) => {
        const handle = cm.getLineHandle(n);
        for (const lv of cm.display.view) {
          if (lv && lv.line === handle) {
            const el = lv.node;
            const pre = lv.text || (el && el.tagName === 'PRE' ? el : el.querySelector('pre.CodeMirror-line'));
            const bg = lv.background || (el && el.querySelector ? el.querySelector('div.CodeMirror-linebackground') : null);
            const r = pre ? pre.getBoundingClientRect() : null;
            const wrapCls = (el && el !== pre && el.className) ? el.className : '';
            return {
              h: r ? Math.round(r.height) : null,
              gray: !!(bg && bg.className.indexOf('cm-wysiwyg-active-block') !== -1),
              blank: wrapCls.indexOf('cm-wysiwyg-blank') !== -1,
              hint: wrapCls.indexOf('cm-empty-placeholder') !== -1,
              inlineLH: pre ? pre.style.lineHeight : null,
            };
          }
        }
        return null;
      };
      const cursorVisible = () => {
        const wr = cm.getWrapperElement().getBoundingClientRect();
        const cc = cm.cursorCoords(cm.getCursor(), 'window');
        return !!(cc && isFinite(cc.top) && cc.top > wr.top && cc.top < wr.bottom);
      };
      const gapLine = imgLine - 1;

      // —— A：光标在块间空行 = 光标行灰底 + 全高 + 无提示（症状①）——
      cm.focus();
      cm.setCursor({ line: gapLine, ch: 0 });
      await sleep2(150);
      const a = lineState(gapLine) || {};
      a.activeIdx = ed._wysiwygActiveIdx;
      a.cursorLine = cm.getCursor().line;
      // —— A2：光标离开 → 该行收回塌缩、灰底撤销 ——
      cm.setCursor({ line: imgLine + 1, ch: 0 });
      await sleep2(150);
      const a2 = lineState(gapLine) || {};
      a2.gray2 = a2.gray; // 改名防混淆

      // —— B：块间空行上连续 4 次真实 Enter（用户操作复现）→ 不得跳顶（症状②）——
      cm.setCursor({ line: gapLine, ch: 0 });
      await sleep2(150);
      // 2026-10-21：等滚动收敛再取 topBefore 基线——异步 pass（图片网络加载/TOC）落定
      // 前滚动可能仍在瞬态（实测同一场景两次运行基线 3173 vs 3048），把瞬态差值记进
      // Enter 窗口会误判为「回车跳动」。收敛判定用**物理** scroller（用户所见）。
      const physTopS = () => {
        try { return Math.round(cm.getScrollerElement().scrollTop); } catch (_) { return Math.round(cm.getScrollInfo().top); }
      };
      let prevTopS = null, stableMs = 0;
      for (let i = 0; i < 20; i++) {
        await sleep2(100);
        const cur = physTopS();
        stableMs = (cur === prevTopS) ? stableMs + 100 : 0;
        prevTopS = cur;
        if (stableMs >= 200) break;
      }
      const linesBefore = cm.lineCount();
      const topBefore = physTopS();
      const t0 = Date.now();
      // 2026-10-21：采样**物理** scroller（用户实际看到的），而非 getScrollInfo().top
      //（= doc.scrollTop 模型值）——原生滚动锚定悄悄移动物理滚动条时模型值滞后，
      // 下一操作末才同步，模型序列会出现「账面 −128」而物理纹丝不动（实测）。
      const physTop = () => {
        try { return Math.round(cm.getScrollerElement().scrollTop); } catch (_) { return Math.round(cm.getScrollInfo().top); }
      };
      const raw = [[0, physTop()]]; // [ms, top]
      const logSample = () => raw.push([Date.now() - t0, physTop()]);
      const sampler = setInterval(logSample, 50);
      const input = cm.getInputField();
      const pressEnter = () => {
        input.focus();
        raw.push([Date.now() - t0, physTop()]);
        input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true, cancelable: true }));
      };
      for (let k = 0; k < 4; k++) { pressEnter(); await sleep2(180); }
      await sleep2(2500); // 等防抖重刷 + 延迟锚定补偿全部落地
      clearInterval(sampler);
      raw.push([Date.now() - t0, physTop()]);
      const vals = raw.map((p) => p[1]);
      let maxDelta = 0;
      for (let i = 1; i < vals.length; i++) maxDelta = Math.max(maxDelta, Math.abs(vals[i] - vals[i - 1]));
      const b = {
        topBefore, topAfter: vals[vals.length - 1], maxDelta,
        lineCountDelta: cm.lineCount() - linesBefore,
        cursor: cm.getCursor(), cursorVisible: cursorVisible(),
        spikes: vals.filter((v, i) => i > 0 && Math.abs(v - vals[i - 1]) >= 60).length,
        series: raw, // [ms, top] 采样序列（回归调试用）
      };

      // —— C：refresh 不得破坏已渲染行的记录行高（Fix A 守卫；独立 refresh 有 pending
      // scroll 自恢复，此处同时断言 scrollTop 不动 + 记录高度保持实测值）——
      const tocHandle = cm.getLineHandle(tocLine);
      const recTocBefore = Math.round(tocHandle.height * 10) / 10;
      const topBeforeRefresh = Math.round(cm.getScrollInfo().top);
      for (let k = 0; k < 3; k++) { cm.refresh(); await sleep2(60); }
      const c = {
        recTocBefore, recTocAfter: Math.round(tocHandle.height * 10) / 10,
        topBeforeRefresh, topAfterRefresh: Math.round(cm.getScrollInfo().top),
      };
      out.a = a; out.a2 = a2; out.b = b; out.c = c;
      out.gapLine = gapLine; out.imgLine = imgLine; out.tocLine = tocLine;
    } catch (e) {
      out.err = String(e && e.message || e);
    }
    return out;
  };
})();
</script>
